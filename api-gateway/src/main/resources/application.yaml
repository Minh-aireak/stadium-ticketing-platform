spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: identity-service
              uri: ${IDENTITY_SERVICE_URL}
              predicates:
                - Path=/api/v1/auth/**
            - id: match-catalog-service
              uri: ${MATCH_CATALOG_SERVICE_URL}
              predicates:
                - Path=/api/v1/matches/**
            - id: ticket-inventory-service
              uri: ${TICKET_INVENTORY_SERVICE_URL}
              predicates:
                - Path=/api/v1/inventory/**
            - id: payment-service
              uri: ${PAYMENT_SERVICE_URL}
              predicates:
                - Path=/api/v1/payments/**
            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URL}
              predicates:
                - Path=/api/v1/notifications/**
            - id: booking-service
              uri: ${BOOKING_SERVICE_URL}
              predicates:
                - Path=/api/v1/bookings/**

server:
  port: 8080

# Must match identity-service's jwt.secret/issuer/audience exactly — same shared HMAC secret,
# injected via env var in every deployment, never hard-coded.
jwt:
  secret: ${JWT_SECRET}
  issuer: ${JWT_ISSUER}
  audience: ${JWT_AUDIENCE}
  public-paths:
    - /api/v1/auth/register
    - /api/v1/auth/login
    - /api/v1/auth/refresh
    - /api/v1/auth/logout
    - /actuator/health
    - /actuator/info

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{correlationId}] %-5level %logger{36} - %msg%n"
