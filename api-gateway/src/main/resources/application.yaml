spring:
  application:
    name: api-gateway

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Downstream service URLs
services:
  identity:
    base-url: ${IDENTITY_SERVICE_URL:http://localhost:8081}
  match-catalog:
    base-url: ${MATCH_CATALOG_SERVICE_URL:http://localhost:8082}
  ticket-inventory:
    base-url: ${TICKET_INVENTORY_SERVICE_URL:http://localhost:8083}
  payment:
    base-url: ${PAYMENT_SERVICE_URL:http://localhost:8084}
  notification:
    base-url: ${NOTIFICATION_SERVICE_URL:http://localhost:8085}
  booking:
    base-url: ${BOOKING_SERVICE_URL:http://localhost:8086}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{correlationId}] %-5level %logger{36} - %msg%n"
