spring:
  application:
    name: identity-service

  datasource:
    url: jdbc:postgresql://localhost:5432/identity_db
    username: ${DB_USERNAME:aireak}
    password: ${DB_PASSWORD:aireak}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8081

jwt:
  # No default — must be injected via env var in every environment. A hardcoded fallback here
  # would let anyone who reads the source mint valid tokens if the env var is ever left unset.
  secret: ${JWT_SECRET}
  # Access token is short-lived by design — 15 min balances UX (silent refresh) vs blast radius if leaked.
  expiration-seconds: ${JWT_EXPIRATION_SECONDS:900}
  issuer: ${JWT_ISSUER:https://auth.aireak.com}
  audience: ${JWT_AUDIENCE:aireak-platform}

refresh-token:
  # Absolute cap on a refresh session's lifetime — rotation does NOT extend this. Forces re-login every 30 days.
  absolute-ttl-seconds: ${REFRESH_TOKEN_ABSOLUTE_TTL_SECONDS:2592000}

auth-cookie:
  name: ${AUTH_COOKIE_NAME:refresh_token}
  path: ${AUTH_COOKIE_PATH:/api/v1/auth}
  domain: ${AUTH_COOKIE_DOMAIN:}
  secure: ${AUTH_COOKIE_SECURE:true}
  same-site: ${AUTH_COOKIE_SAME_SITE:Strict}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{correlationId}] %-5level %logger{36} - %msg%n"
