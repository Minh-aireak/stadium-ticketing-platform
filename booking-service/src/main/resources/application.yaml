spring:
  application:
    name: booking-service

  datasource:
    url: jdbc:postgresql://localhost:5432/booking_db
    username: ${DB_USERNAME:aireak}
    password: ${DB_PASSWORD:aireak}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8086

# Downstream service URLs
services:
  ticket-inventory:
    base-url: ${TICKET_INVENTORY_SERVICE_URL:http://localhost:8083}
  payment:
    base-url: ${PAYMENT_SERVICE_URL:http://localhost:8084}

booking:
  inventory-confirmation-reconciler:
    # Only retry CONFIRMED bookings whose inventory confirm is still unresolved after this
    # long, so the job never races the synchronous attempt in confirmBooking().
    grace-minutes: ${INVENTORY_RECONCILER_GRACE_MINUTES:5}
    fixed-delay-ms: ${INVENTORY_RECONCILER_FIXED_DELAY_MS:300000}
    # Caps how many bookings a single run retries — a real backlog drains over several cycles.
    batch-size: ${INVENTORY_RECONCILER_BATCH_SIZE:200}

# Resilience4j circuit breaker config
resilience4j:
  circuitbreaker:
    instances:
      ticket-inventory:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
      payment:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
  retry:
    instances:
      ticket-inventory:
        maxAttempts: 3
        waitDuration: 500ms
        ignoreExceptions:
          - org.springframework.web.client.HttpClientErrorException
      payment:
        maxAttempts: 3
        waitDuration: 500ms
        ignoreExceptions:
          - org.springframework.web.client.HttpClientErrorException

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{correlationId}] %-5level %logger{36} - %msg%n"
