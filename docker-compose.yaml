# =============================================================================
# Stadium Ticketing Platform — Local Development Infrastructure
# =============================================================================
# Usage: docker compose up -d
# Services use internal 'stadium-net' network.
# =============================================================================

networks:
  stadium-net:
    driver: bridge

volumes:
  postgres_identity:
  postgres_inventory:
  postgres_booking:
  postgres_payment:
  postgres_catalog:
  postgres_notification:
  redis_data:
  kafka_data:
  elasticsearch_data:
  prometheus_data:
  grafana_data:

services:

  # ---- PostgreSQL — identity-service -----------------------------------
  # wal_level=logical is required for Debezium's CDC connector to read the
  # outbox_events table via logical replication (see infra/debezium/).
  postgres-identity:
    image: postgres:16-alpine
    container_name: postgres-identity_stadium_booking
    command: ["postgres", "-c", "wal_level=logical"]
    networks: [stadium-net]
    environment:
      POSTGRES_DB: identity_db
      POSTGRES_USER: aireak
      POSTGRES_PASSWORD: aireak
    ports:
      - "5432:5432"
    volumes:
      - postgres_identity:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aireak -d identity_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- PostgreSQL — ticket-inventory-service ----------------------------
  # wal_level=logical is required for Debezium's CDC connector to read the
  # outbox_events table via logical replication (see infra/debezium/).
  postgres-inventory:
    image: postgres:16-alpine
    container_name: postgres-inventory_stadium_booking
    command: ["postgres", "-c", "wal_level=logical"]
    networks: [stadium-net]
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: aireak
      POSTGRES_PASSWORD: aireak
    ports:
      - "5433:5432"
    volumes:
      - postgres_inventory:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aireak -d inventory_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- PostgreSQL — booking-service ------------------------------------
  # wal_level=logical is required for Debezium's CDC connector to read the
  # outbox_events table via logical replication (see infra/debezium/).
  postgres-booking:
    image: postgres:16-alpine
    container_name: postgres-booking_stadium_booking
    command: ["postgres", "-c", "wal_level=logical"]
    networks: [stadium-net]
    environment:
      POSTGRES_DB: booking_db
      POSTGRES_USER: aireak
      POSTGRES_PASSWORD: aireak
    ports:
      - "5434:5432"
    volumes:
      - postgres_booking:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aireak -d booking_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- PostgreSQL — payment-service ------------------------------------
  # wal_level=logical is required for Debezium's CDC connector to read the
  # outbox_events table via logical replication (see infra/debezium/).
  postgres-payment:
    image: postgres:16-alpine
    container_name: postgres-payment_stadium_booking
    command: ["postgres", "-c", "wal_level=logical"]
    networks: [stadium-net]
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: aireak
      POSTGRES_PASSWORD: aireak
    ports:
      - "5435:5432"
    volumes:
      - postgres_payment:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aireak -d payment_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- PostgreSQL — match-catalog-service ------------------------------
  # wal_level=logical is required for Debezium's CDC connector to read the
  # outbox_events table via logical replication (see infra/debezium/).
  postgres-catalog:
    image: postgres:16-alpine
    container_name: postgres-catalog_stadium_booking
    command: ["postgres", "-c", "wal_level=logical"]
    networks: [stadium-net]
    environment:
      POSTGRES_DB: catalog_db
      POSTGRES_USER: aireak
      POSTGRES_PASSWORD: aireak
    ports:
      - "5436:5432"
    volumes:
      - postgres_catalog:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aireak -d catalog_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- PostgreSQL — notification-service --------------------------------
  # No Debezium connector reads this one (notification-service is a pure Kafka
  # consumer, not an outbox producer) — wal_level=logical is kept only for
  # consistency with the other 5 Postgres containers, not because it's needed.
  postgres-notification:
    image: postgres:16-alpine
    container_name: postgres-notification_stadium_booking
    command: ["postgres", "-c", "wal_level=logical"]
    networks: [stadium-net]
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: aireak
      POSTGRES_PASSWORD: aireak
    ports:
      - "5437:5432"
    volumes:
      - postgres_notification:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aireak -d notification_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Redis (Redisson distributed lock + cache) -----------------------
  redis:
    image: redis:7-alpine
    container_name: redis_stadium_booking
    networks: [stadium-net]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    # Every consumer (Redisson autoconfig, Spring Data's Lettuce client) sends an AUTH command
    # unconditionally once spring.data.redis.password is set to anything, even "" — and a
    # password-less Redis rejects AUTH outright, so a real password is required end-to-end here.
    command: redis-server --save 60 1 --loglevel warning --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Kafka (KRaft mode — no ZooKeeper required) ---------------------
  # Confluent Platform 8.x drops ZooKeeper entirely; KRaft is the only mode.
  # CLUSTER_ID must be a stable base64-encoded UUID; generate a fresh one with:
  #   docker run --rm confluentinc/cp-kafka:8.3.0 kafka-storage random-uuid
  # then replace the value below before first boot (changing it later requires
  # wiping the kafka_data volume).
  kafka:
    image: confluentinc/cp-kafka:8.3.0
    container_name: kafka_stadium_booking
    networks: [stadium-net]
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:9093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM1Tk
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ---- Kafka Connect + Debezium (CDC from outbox tables to Kafka) ------
  # Connectors are auto-registered by the kafka-connect-init service below
  # once this container reports healthy. To re-register one manually after
  # editing its JSON (e.g. after a config change), re-run e.g.:
  #   curl -X POST -H "Content-Type: application/json" \
  #     --data @backend/identity-service/infra/debezium/identity-outbox-connector.json \
  #     http://localhost:8083/connectors
  kafka-connect:
    image: debezium/connect:2.7.3.Final
    container_name: kafka-connect_stadium_booking
    networks: [stadium-net]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: identity-outbox-connect
      CONFIG_STORAGE_TOPIC: _identity_connect_configs
      OFFSET_STORAGE_TOPIC: _identity_connect_offsets
      STATUS_STORAGE_TOPIC: _identity_connect_status
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ---- Kafka Connect init (auto-registers Debezium connectors) --------
  # Runs once kafka-connect is healthy, POSTs all 5 outbox connector configs,
  # then exits. Idempotent: a 409 (connector already exists) counts as
  # success, so re-running `docker compose up -d` is always safe.
  kafka-connect-init:
    image: curlimages/curl:8.11.0
    container_name: kafka-connect-init_stadium_booking
    networks: [stadium-net]
    depends_on:
      kafka-connect:
        condition: service_healthy
      postgres-identity:
        condition: service_healthy
      postgres-inventory:
        condition: service_healthy
      postgres-booking:
        condition: service_healthy
      postgres-payment:
        condition: service_healthy
      postgres-catalog:
        condition: service_healthy
    volumes:
      - ./infra/kafka-connect/register-connectors.sh:/register-connectors.sh:ro
      - ./backend/identity-service/infra/debezium/identity-outbox-connector.json:/connectors/identity-outbox-connector.json:ro
      - ./backend/booking-service/infra/debezium/booking-outbox-connector.json:/connectors/booking-outbox-connector.json:ro
      - ./backend/ticket-inventory-service/infra/debezium/inventory-outbox-connector.json:/connectors/inventory-outbox-connector.json:ro
      - ./backend/payment-service/infra/debezium/payment-outbox-connector.json:/connectors/payment-outbox-connector.json:ro
      - ./backend/match-catalog-service/infra/debezium/catalog-outbox-connector.json:/connectors/catalog-outbox-connector.json:ro
    entrypoint: ["/bin/sh", "/register-connectors.sh"]

  # ---- Elasticsearch (match catalog read model) ------------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.0
    container_name: elasticsearch_stadium_booking
    networks: [stadium-net]
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q 'green\\|yellow'"]
      interval: 20s
      timeout: 10s
      retries: 10

  # ---- Mailpit (SMTP catcher for notification-service's outgoing emails) -----
  # Web UI at http://localhost:8025 shows every email sent by notification-service —
  # nothing is actually delivered to a real inbox in local dev.
  mailpit:
    image: axllent/mailpit:v1.24
    container_name: mailpit_stadium_booking
    networks: [stadium-net]
    ports:
      - "1025:1025"
      - "8025:8025"

  # ---- identity-service (auth, JWT issuance, admin bootstrap) ----------
  identity-service:
    build:
      context: ./backend
      dockerfile: identity-service/Dockerfile
    container_name: identity-service_stadium_booking
    networks: [stadium-net]
    depends_on:
      postgres-identity:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      DB_HOST: postgres-identity
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS}
      REFRESH_TOKEN_ABSOLUTE_TTL_SECONDS: ${REFRESH_TOKEN_ABSOLUTE_TTL_SECONDS}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME}
      AUTH_COOKIE_PATH: ${AUTH_COOKIE_PATH}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE}
      AUTH_COOKIE_SAME_SITE: ${AUTH_COOKIE_SAME_SITE}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}

  # ---- match-catalog-service (match browse/search, Elasticsearch read model) ----
  match-catalog-service:
    build:
      context: ./backend
      dockerfile: match-catalog-service/Dockerfile
    container_name: match-catalog-service_stadium_booking
    networks: [stadium-net]
    depends_on:
      postgres-catalog:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8082:8082"
    environment:
      DB_HOST: postgres-catalog
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      ELASTICSEARCH_HOST: elasticsearch
      ELASTICSEARCH_PORT: 9200
      ELASTICSEARCH_SCHEME: http
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}

  # ---- ticket-inventory-service (seat holds, Redisson locks) -----------
  ticket-inventory-service:
    build:
      context: ./backend
      dockerfile: ticket-inventory-service/Dockerfile
    container_name: ticket-inventory-service_stadium_booking
    networks: [stadium-net]
    depends_on:
      postgres-inventory:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      # Host 8087 avoids clashing with kafka-connect's 8083; container-internal port and
      # inter-service URLs (ticket-inventory-service:8083) are unchanged.
      - "8087:8083"
    environment:
      DB_HOST: postgres-inventory
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MATCH_CATALOG_SERVICE_URL: http://match-catalog-service:8082
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}

  # ---- payment-service (Stripe charges, refunds) -----------------------
  payment-service:
    build:
      context: ./backend
      dockerfile: payment-service/Dockerfile
    container_name: payment-service_stadium_booking
    networks: [stadium-net]
    depends_on:
      postgres-payment:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8084:8084"
    environment:
      DB_HOST: postgres-payment
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # booking-service is reachable inside stadium-net by its container DNS name.
      BOOKING_SERVICE_URL: http://booking-service:8086
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}

  # ---- notification-service (Kafka consumer, transactional email) -----
  notification-service:
    build:
      context: ./backend
      dockerfile: notification-service/Dockerfile
    container_name: notification-service_stadium_booking
    networks: [stadium-net]
    depends_on:
      postgres-notification:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "8085:8085"
    environment:
      DB_HOST: postgres-notification
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      # The verify-email link is opened by the end user's browser, so it must point at the
      # host-mapped port, not identity-service's container DNS name.
      IDENTITY_SERVICE_BASE_URL: http://localhost:8081
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}

  # ---- booking-service (saga orchestration across inventory/payment) --
  booking-service:
    build:
      context: ./backend
      dockerfile: booking-service/Dockerfile
    container_name: booking-service_stadium_booking
    networks: [stadium-net]
    depends_on:
      postgres-booking:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      ticket-inventory-service:
        condition: service_started
      payment-service:
        condition: service_started
    ports:
      - "8086:8086"
    environment:
      DB_HOST: postgres-booking
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      TICKET_INVENTORY_SERVICE_URL: http://ticket-inventory-service:8083
      PAYMENT_SERVICE_URL: http://payment-service:8084
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}

  # ---- api-gateway (single entrypoint, JWT validation, rate limiting) --
  api-gateway:
    build:
      context: ./backend
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway_stadium_booking
    networks: [stadium-net]
    depends_on:
      redis:
        condition: service_healthy
      identity-service:
        condition: service_started
      match-catalog-service:
        condition: service_started
      ticket-inventory-service:
        condition: service_started
      payment-service:
        condition: service_started
      notification-service:
        condition: service_started
      booking-service:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      IDENTITY_SERVICE_URL: http://identity-service:8081
      MATCH_CATALOG_SERVICE_URL: http://match-catalog-service:8082
      TICKET_INVENTORY_SERVICE_URL: http://ticket-inventory-service:8083
      PAYMENT_SERVICE_URL: http://payment-service:8084
      NOTIFICATION_SERVICE_URL: http://notification-service:8085
      BOOKING_SERVICE_URL: http://booking-service:8086
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}

  # ---- frontend (React/Vite SPA, built and served via Nginx) -----------
  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the JS bundle at build time — must be reachable from the browser
        # (host-mapped api-gateway port), not api-gateway's container DNS name.
        VITE_API_BASE_URL: http://localhost:8080/api/v1
    container_name: frontend_stadium_booking
    networks: [stadium-net]
    depends_on:
      - api-gateway
    ports:
      - "5173:80"

  # ---- Prometheus (metrics scraping) -----------------------------------
  # Scrapes /actuator/prometheus on every backend service's main API port (see
  # infra/prometheus/prometheus.yml) via each service's container DNS name, since every
  # backend service is now built and run as a container on stadium-net (see above).
  # /actuator/prometheus is deliberately public (no ADMIN JWT required) — see
  # backend/common/.../ActuatorAccessFilter.java — since Prometheus has no user JWT to present.
  prometheus:
    image: prom/prometheus:v3.13.2
    container_name: prometheus_stadium_booking
    networks: [stadium-net]
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ---- Node Exporter (host CPU/memory/disk/network metrics) ------------
  # NOTE (Windows/Mac): Docker Desktop runs containers inside a Linux VM, so the /proc,
  # /sys, / mounts below report metrics for that VM, not the raw Windows/Mac host. On a
  # native Linux host this reports the real host machine.
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node_exporter_stadium_booking
    networks: [stadium-net]
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    ports:
      - "9100:9100"

  # ---- Grafana (dashboards over Prometheus) ----------------------------
  grafana:
    image: grafana/grafana:13.1.1
    container_name: grafana_stadium_booking
    networks: [stadium-net]
    depends_on:
      prometheus:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---- Kafka UI (optional dev tool) -----------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui_stadium_booking
    networks: [stadium-net]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_KRAFT_ENABLED: "true"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    profiles:
      - tools
