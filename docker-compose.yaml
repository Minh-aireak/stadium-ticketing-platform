# =============================================================================
# Stadium Ticketing Platform — Local Development Infrastructure
# =============================================================================
# Usage: docker compose up -d
# Services use internal 'stadium-net' network.
# =============================================================================

networks:
  stadium-net:
    driver: bridge

volumes:
  postgres_identity:
  postgres_inventory:
  postgres_booking:
  postgres_payment:
  postgres_catalog:
  postgres_notification:
  redis_data:
  kafka_data:
  elasticsearch_data:
  logstash_data:
  prometheus_data:
  grafana_data:
  app_logs:

x-ticket-inventory-service: &ticket-inventory-service
  build:
    context: ./backend
    dockerfile: ticket-inventory-service/Dockerfile
  networks: [stadium-net]
  depends_on:
    postgres-inventory:
      condition: service_healthy
    redis:
      condition: service_healthy
    kafka:
      condition: service_healthy
  volumes:
    - app_logs:/var/log/app
  healthcheck:
    test: ["CMD-SHELL", "curl -sf http://localhost:8083/actuator/health"]
    interval: 15s
    timeout: 5s
    retries: 20
    start_period: 60s
  # Longer than spring.lifecycle.timeout-per-shutdown-phase (30s), so SIGKILL never
  # arrives while the JVM is still draining. Docker's default is 10s.
  stop_grace_period: 40s

x-ticket-inventory-service-env: &ticket-inventory-service-env
  DB_HOST: postgres-inventory
  DB_PORT: 5432
  DB_USERNAME: ${DB_USERNAME}
  DB_PASSWORD: ${DB_PASSWORD}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  # The load balancer, not an instance -- same reasoning as TICKET_INVENTORY_SERVICE_URL.
  MATCH_CATALOG_SERVICE_URL: http://catalog-lb:8082
  JWT_SECRET: ${JWT_SECRET}
  JWT_PREVIOUS_SECRET: ${JWT_PREVIOUS_SECRET}
  JWT_INTERNAL_SECRET: ${JWT_INTERNAL_SECRET}
  JWT_ISSUER: ${JWT_ISSUER}
  JWT_AUDIENCE: ${JWT_AUDIENCE}

x-booking-service: &booking-service
  build:
    context: ./backend
    dockerfile: booking-service/Dockerfile
  networks: [stadium-net]
  depends_on:
    postgres-booking:
      condition: service_healthy
    redis:
      condition: service_healthy
    kafka:
      condition: service_healthy
    ticket-inventory-lb:
      condition: service_healthy
    payment-service:
      condition: service_healthy
  volumes:
    - app_logs:/var/log/app
  healthcheck:
    test: ["CMD-SHELL", "curl -sf http://localhost:8086/actuator/health"]
    interval: 15s
    timeout: 5s
    retries: 20
    start_period: 60s
  # Longer than spring.lifecycle.timeout-per-shutdown-phase (30s), so SIGKILL never
  # arrives while the JVM is still draining. Docker's default is 10s.
  stop_grace_period: 40s

x-booking-service-env: &booking-service-env
  DB_HOST: postgres-booking
  DB_PORT: 5432
  DB_USERNAME: ${DB_USERNAME}
  DB_PASSWORD: ${DB_PASSWORD}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  # The load balancer, not an instance: booking's saga calls must spread across both
  # inventory replicas the same way the gateway's do.
  TICKET_INVENTORY_SERVICE_URL: http://ticket-inventory-lb:8083
  PAYMENT_SERVICE_URL: http://payment-service:8084
  JWT_SECRET: ${JWT_SECRET}
  JWT_PREVIOUS_SECRET: ${JWT_PREVIOUS_SECRET}
  JWT_INTERNAL_SECRET: ${JWT_INTERNAL_SECRET}
  JWT_ISSUER: ${JWT_ISSUER}
  JWT_AUDIENCE: ${JWT_AUDIENCE}

x-match-catalog-service: &match-catalog-service
  build:
    context: ./backend
    dockerfile: match-catalog-service/Dockerfile
  networks: [stadium-net]
  depends_on:
    postgres-catalog:
      condition: service_healthy
    # Waits for the accounts, not just for a healthy cluster: catalog_service does not exist
    # until elasticsearch-init has run, and every request would 401 until it does.
    elasticsearch-init:
      condition: service_completed_successfully
    kafka:
      condition: service_healthy
    redis:
      condition: service_healthy
  volumes:
    - app_logs:/var/log/app
  healthcheck:
    test: ["CMD-SHELL", "curl -sf http://localhost:8082/actuator/health"]
    interval: 15s
    timeout: 5s
    retries: 20
    start_period: 60s

x-match-catalog-service-env: &match-catalog-service-env
  DB_HOST: postgres-catalog
  DB_PORT: 5432
  DB_USERNAME: ${DB_USERNAME}
  DB_PASSWORD: ${DB_PASSWORD}
  ELASTICSEARCH_HOST: elasticsearch
  ELASTICSEARCH_PORT: 9200
  ELASTICSEARCH_SCHEME: http
  # Scoped to the "matches" index only — this service has no access to the platform's logs.
  ELASTICSEARCH_USERNAME: catalog_service
  ELASTICSEARCH_PASSWORD: ${CATALOG_ES_PASSWORD}
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  JWT_SECRET: ${JWT_SECRET}
  JWT_PREVIOUS_SECRET: ${JWT_PREVIOUS_SECRET}
  JWT_INTERNAL_SECRET: ${JWT_INTERNAL_SECRET}
  JWT_ISSUER: ${JWT_ISSUER}
  JWT_AUDIENCE: ${JWT_AUDIENCE}

services:

  # ---- PostgreSQL — identity-service -----------------------------------
  # wal_level=logical is required for Debezium's CDC connector to read the
  # outbox_events table via logical replication (see infra/debezium/).
  postgres-identity:
    image: postgres:16-alpine
    container_name: postgres-identity_stadium_booking
    command: ["postgres", "-c", "wal_level=logical"]
    networks: [stadium-net]
    environment:
      POSTGRES_DB: identity_db
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_identity:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d identity_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- PostgreSQL — ticket-inventory-service ----------------------------
  # wal_level=logical is required for Debezium's CDC connector to read the
  # outbox_events table via logical replication (see infra/debezium/).
  postgres-inventory:
    image: postgres:16-alpine
    container_name: postgres-inventory_stadium_booking
    command: ["postgres", "-c", "wal_level=logical"]
    networks: [stadium-net]
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_inventory:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d inventory_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- PostgreSQL — booking-service ------------------------------------
  # wal_level=logical is required for Debezium's CDC connector to read the
  # outbox_events table via logical replication (see infra/debezium/).
  postgres-booking:
    image: postgres:16-alpine
    container_name: postgres-booking_stadium_booking
    command: ["postgres", "-c", "wal_level=logical"]
    networks: [stadium-net]
    environment:
      POSTGRES_DB: booking_db
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - postgres_booking:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d booking_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- PostgreSQL — payment-service ------------------------------------
  # wal_level=logical is required for Debezium's CDC connector to read the
  # outbox_events table via logical replication (see infra/debezium/).
  postgres-payment:
    image: postgres:16-alpine
    container_name: postgres-payment_stadium_booking
    command: ["postgres", "-c", "wal_level=logical"]
    networks: [stadium-net]
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - postgres_payment:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d payment_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- PostgreSQL — match-catalog-service ------------------------------
  # wal_level=logical is required for Debezium's CDC connector to read the
  # outbox_events table via logical replication (see infra/debezium/).
  postgres-catalog:
    image: postgres:16-alpine
    container_name: postgres-catalog_stadium_booking
    command: ["postgres", "-c", "wal_level=logical"]
    networks: [stadium-net]
    environment:
      POSTGRES_DB: catalog_db
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5436:5432"
    volumes:
      - postgres_catalog:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d catalog_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- PostgreSQL — notification-service --------------------------------
  # No Debezium connector reads this one (notification-service is a pure Kafka
  # consumer, not an outbox producer) — wal_level=logical is kept only for
  # consistency with the other 5 Postgres containers, not because it's needed.
  postgres-notification:
    image: postgres:16-alpine
    container_name: postgres-notification_stadium_booking
    command: ["postgres", "-c", "wal_level=logical"]
    networks: [stadium-net]
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5437:5432"
    volumes:
      - postgres_notification:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d notification_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- PostgreSQL Exporter (multi-target: probes all 6 Postgres instances from
  # one container instead of one exporter per database — same metrics, 1 container
  # instead of 6). Uses postgres_exporter's /probe endpoint (see infra/postgres-exporter/
  # config.yaml for the shared "aireak" auth module); Prometheus passes each target via
  # relabeling (see infra/prometheus/prometheus.yml).
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    container_name: postgres-exporter_stadium_booking
    networks: [stadium-net]
    depends_on:
      postgres-identity:
        condition: service_healthy
      postgres-inventory:
        condition: service_healthy
      postgres-booking:
        condition: service_healthy
      postgres-payment:
        condition: service_healthy
      postgres-catalog:
        condition: service_healthy
      postgres-notification:
        condition: service_healthy
    volumes:
      - ./infra/postgres-exporter/config.yaml:/config/config.yaml:ro
    command:
      - --config.file=/config/config.yaml
    ports:
      - "9187:9187"

  # ---- Redis (Redisson distributed lock + cache) -----------------------
  redis:
    image: redis:7-alpine
    container_name: redis_stadium_booking
    networks: [stadium-net]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    # Every consumer (Redisson autoconfig, Spring Data's Lettuce client) sends an AUTH command
    # unconditionally once spring.data.redis.password is set to anything, even "" — and a
    # password-less Redis rejects AUTH outright, so a real password is required end-to-end here.
    command: redis-server --save 60 1 --loglevel warning --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Redis Exporter (metrics for Prometheus) -------------------------
  redis-exporter:
    image: oliver006/redis_exporter:v1.75.0
    container_name: redis-exporter_stadium_booking
    networks: [stadium-net]
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "9121:9121"

  # ---- Kafka (KRaft mode — no ZooKeeper required) ---------------------
  # Confluent Platform 8.x drops ZooKeeper entirely; KRaft is the only mode.
  # CLUSTER_ID must be a stable base64-encoded UUID; generate a fresh one with:
  #   docker run --rm confluentinc/cp-kafka:8.3.0 kafka-storage random-uuid
  # then replace the value below before first boot (changing it later requires
  # wiping the kafka_data volume).
  kafka:
    image: confluentinc/cp-kafka:8.3.0
    container_name: kafka_stadium_booking
    networks: [stadium-net]
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:9093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM1Tk
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ---- Kafka Connect + Debezium (CDC from outbox tables to Kafka) ------
  # Connectors are auto-registered by the kafka-connect-init service below
  # once this container reports healthy. To re-register one manually after
  # editing its JSON (e.g. after a config change), re-run e.g.:
  #   curl -X POST -H "Content-Type: application/json" \
  #     --data @backend/identity-service/infra/debezium/identity-outbox-connector.json \
  #     http://localhost:8083/connectors
  kafka-connect:
    image: debezium/connect:2.7.3.Final
    container_name: kafka-connect_stadium_booking
    networks: [stadium-net]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: identity-outbox-connect
      CONFIG_STORAGE_TOPIC: _identity_connect_configs
      OFFSET_STORAGE_TOPIC: _identity_connect_offsets
      STATUS_STORAGE_TOPIC: _identity_connect_status
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      # Lets a connector config say ${file:<path>:<key>} instead of embedding a credential.
      # The connector JSONs in backend/*/infra/debezium/ use it for the Postgres login, so the
      # only place those live is .env — they used to be hardcoded to aireak/aireak, which meant
      # changing DB_USERNAME/DB_PASSWORD silently broke CDC for every service.
      CONNECT_CONFIG_PROVIDERS: file
      CONNECT_CONFIG_PROVIDERS_FILE_CLASS: org.apache.kafka.common.config.provider.FileConfigProvider
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    # Writes the secrets file the provider above reads, then hands over to the image's own
    # entrypoint. It has to happen here rather than in kafka-connect-init because Connect
    # re-resolves ${file:...} every time it instantiates a connector, including on restart --
    # so the file must exist for the container's whole life, not just at registration time.
    # printf writes the values verbatim; only a backslash needs escaping, because
    # java.util.Properties would otherwise read it as the start of an escape sequence.
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        umask 077
        mkdir -p /kafka/connect-secrets
        esc() { printf '%s' "$$1" | sed 's/\\/\\\\/g'; }
        {
          printf 'username=%s\n' "$$(esc "$$DB_USERNAME")"
          printf 'password=%s\n' "$$(esc "$$DB_PASSWORD")"
        } > /kafka/connect-secrets/postgres.properties
        exec /docker-entrypoint.sh start
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ---- Kafka Connect init (auto-registers Debezium connectors) --------
  # Runs once kafka-connect is healthy, POSTs all 5 outbox connector configs,
  # then exits. Idempotent: a 409 (connector already exists) counts as
  # success, so re-running `docker compose up -d` is always safe.
  kafka-connect-init:
    image: curlimages/curl:8.11.0
    container_name: kafka-connect-init_stadium_booking
    networks: [stadium-net]
    depends_on:
      kafka-connect:
        condition: service_healthy
      postgres-identity:
        condition: service_healthy
      postgres-inventory:
        condition: service_healthy
      postgres-booking:
        condition: service_healthy
      postgres-payment:
        condition: service_healthy
      postgres-catalog:
        condition: service_healthy
    volumes:
      - ./infra/kafka-connect/register-connectors.sh:/register-connectors.sh:ro
      - ./backend/identity-service/infra/debezium/identity-outbox-connector.json:/connectors/identity-outbox-connector.json:ro
      - ./backend/booking-service/infra/debezium/booking-outbox-connector.json:/connectors/booking-outbox-connector.json:ro
      - ./backend/ticket-inventory-service/infra/debezium/inventory-outbox-connector.json:/connectors/inventory-outbox-connector.json:ro
      - ./backend/payment-service/infra/debezium/payment-outbox-connector.json:/connectors/payment-outbox-connector.json:ro
      - ./backend/match-catalog-service/infra/debezium/catalog-outbox-connector.json:/connectors/catalog-outbox-connector.json:ro
    entrypoint: ["/bin/sh", "/register-connectors.sh"]

  # ---- Kafka Exporter (consumer group lag / partition metrics) ---------
  # Broker-side, not client-side: it asks Kafka itself for each group's committed offset and
  # each partition's end offset, so lag stays visible even while a consumer is down -- exactly
  # when you most want to see it. The services' own Micrometer registries cannot report this,
  # because every service hand-rolls its consumerFactory and Boot's Kafka metrics
  # autoconfiguration only instruments the factory it builds itself.
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    container_name: kafka-exporter_stadium_booking
    networks: [stadium-net]
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - --kafka.server=kafka:29092
    ports:
      - "9308:9308"

  # ---- Elasticsearch (match catalog read model + log store) ------------
  # 9.5.1 is the current release of the Elastic Stack, and kibana/logstash below are pinned to
  # the exact same version deliberately: Kibana refuses to start against an Elasticsearch on a
  # different minor. Bumping this means bumping elasticsearch-java in backend/pom.xml and the
  # Testcontainers image in ElasticsearchMatchSearchAdapterIntegrationTest too.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.1
    container_name: elasticsearch_stadium_booking
    networks: [stadium-net]
    environment:
      # Cluster settings live in infra/elasticsearch/elasticsearch.yml. These two stay here: heap
      # is a JVM flag, and ELASTIC_PASSWORD is a secret that must not sit in a committed file.
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      # Bootstraps the built-in elastic superuser on first start. It is used by nothing except
      # elasticsearch-init below — the three real clients each get their own scoped account.
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
    ports:
      - "9200:9200"
    volumes:
      - ./infra/elasticsearch/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      # $$ELASTIC_PASSWORD, not ${ELASTIC_PASSWORD}: the single $ form is interpolated by Compose
      # and would bake the password into the container's inspectable config a second time. The
      # double $ leaves it for the container's own shell, which reads it from the env above.
      test: ["CMD-SHELL", "curl -s -u elastic:$$ELASTIC_PASSWORD http://localhost:9200/_cluster/health | grep -q 'green\\|yellow'"]
      interval: 20s
      timeout: 10s
      retries: 10

  # ---- Elasticsearch security init (creates the per-client accounts) ---------
  # Runs once against a healthy cluster, provisions users/roles, exits. Everything that talks to
  # Elasticsearch waits on service_completed_successfully rather than merely on the cluster being
  # healthy, because a healthy cluster with no accounts yet would reject them all with a 401.
  # See infra/elasticsearch/init-security.sh for why this cannot be done with env vars alone.
  elasticsearch-init:
    image: curlimages/curl:8.11.0
    container_name: elasticsearch-init_stadium_booking
    networks: [stadium-net]
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      KIBANA_SYSTEM_PASSWORD: ${KIBANA_SYSTEM_PASSWORD}
      LOGSTASH_PASSWORD: ${LOGSTASH_PASSWORD}
      CATALOG_ES_PASSWORD: ${CATALOG_ES_PASSWORD}
    volumes:
      - ./infra/elasticsearch/init-security.sh:/init-security.sh:ro
    entrypoint: ["/bin/sh", "/init-security.sh"]

  # ---- Logstash (ships service logs into Elasticsearch) ----------------
  # Tails the ECS JSON files the backend services write onto app_logs; pipeline and rationale
  # live in infra/logstash/pipeline/logstash.conf. Nothing depends on this container: logs are
  # files, so whatever is written while Logstash is down is picked up when it comes back.
  logstash:
    image: docker.elastic.co/logstash/logstash:9.5.1
    container_name: logstash_stadium_booking
    networks: [stadium-net]
    depends_on:
      elasticsearch-init:
        condition: service_completed_successfully
    environment:
      # Default is 1g, which is more than a single file-to-Elasticsearch pipeline needs and real
      # money on a machine already running ~20 containers.
      LS_JAVA_OPTS: "-Xms256m -Xmx256m"
      # Read by ${...} substitution in the pipeline's elasticsearch output, so the credentials
      # stay out of the committed logstash.conf. logstash_internal can only append documents to
      # logs-stadium-* — see infra/elasticsearch/init-security.sh.
      LOGSTASH_USERNAME: logstash_internal
      LOGSTASH_PASSWORD: ${LOGSTASH_PASSWORD}
    ports:
      # Monitoring API — `curl localhost:9600/_node/stats/pipelines` is how you check whether the
      # pipeline is running and how many events it has actually shipped.
      - "9600:9600"
    volumes:
      - ./infra/logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./infra/logstash/pipeline:/usr/share/logstash/pipeline:ro
      # Read-only: this pipeline consumes the services' logs, it must never write to them.
      - app_logs:/var/log/app:ro
      # Holds sincedb (per-file read offsets), so a restart resumes instead of re-indexing
      # everything on disk.
      - logstash_data:/usr/share/logstash/data
    healthcheck:
      # /_health_report aggregates the pipeline indicators. Two details this has to get right:
      # the result is captured first, because a bare `curl | grep` reports success whenever grep
      # matches even if curl itself failed; and it greps for the ABSENCE of red rather than the
      # presence of green, because a red report still contains green sub-indicators.
      test: ["CMD-SHELL", "r=$$(curl -sf http://localhost:9600/_health_report) && printf '%s' \"$$r\" | grep -q '\"pipelines\"' && ! printf '%s' \"$$r\" | grep -q '\"status\":\"red\"'"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ---- Kibana (log search / dashboards over Elasticsearch) -------------
  # Must stay on the exact same version as elasticsearch above — Kibana validates the cluster
  # version on startup and refuses to run against a different minor.
  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.1
    container_name: kibana_stadium_booking
    networks: [stadium-net]
    depends_on:
      elasticsearch-init:
        condition: service_completed_successfully
    ports:
      - "5601:5601"
    environment:
      # Kibana settings live in infra/kibana/kibana.yml. These stay here: NODE_OPTIONS is a Node
      # runtime flag (Kibana's heap defaults high for a container only serving log search), and
      # the password is a secret that must not sit in a committed file.
      NODE_OPTIONS: --max-old-space-size=768
      # kibana_system, never elastic: Kibana rejects the superuser at config-validation time,
      # because a superuser cannot write the system indices Kibana depends on.
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${KIBANA_SYSTEM_PASSWORD}
    volumes:
      - ./infra/kibana/kibana.yml:/usr/share/kibana/config/kibana.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5601/api/status | grep -q '\"level\":\"available\"'"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 90s

  # ---- identity-service (auth, JWT issuance, admin bootstrap) ----------
  identity-service:
    build:
      context: ./backend
      dockerfile: identity-service/Dockerfile
    container_name: identity-service_stadium_booking
    networks: [stadium-net]
    depends_on:
      postgres-identity:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8081:8081"
    volumes:
      - app_logs:/var/log/app
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    environment:
      # Turns on the ECS JSON log file Logstash tails; see the logging block in
      # this service's application.yaml for why it is set here and not there.
      LOGGING_FILE_NAME: /var/log/app/identity-service.log
      DB_HOST: postgres-identity
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_PREVIOUS_SECRET: ${JWT_PREVIOUS_SECRET}
      JWT_INTERNAL_SECRET: ${JWT_INTERNAL_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      # These seven are commented out in .env.example on purpose — they are optional overrides.
      # Each therefore needs its default spelled out HERE with `:-`, because a bare ${VAR} on an
      # unset variable still defines the variable in the container, as an empty string. Spring's
      # own `${VAR:default}` in application.yaml only fires when the property is *absent*, so an
      # empty one wins over the default: a fresh clone would get a blank cookie name and a blank
      # expiry, and identity-service would fail to start. Keep these in sync with
      # identity-service/src/main/resources/application.yaml.
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:-900}
      REFRESH_TOKEN_ABSOLUTE_TTL_SECONDS: ${REFRESH_TOKEN_ABSOLUTE_TTL_SECONDS:-2592000}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-refresh_token}
      AUTH_COOKIE_PATH: ${AUTH_COOKIE_PATH:-/api/v1/auth}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      AUTH_COOKIE_SAME_SITE: ${AUTH_COOKIE_SAME_SITE:-Strict}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}

  # ---- match-catalog-service (match browse/search, Elasticsearch read model) ----
  # ---- match-catalog-service, instance 1 (browse/search read model) ----
  # Two instances are what make CachingMatchRepository's local tier observable: save() invalidates
  # Redis and the writing pod's own Guava cache, but cannot reach into the other pod's, so an admin
  # publish/cancel stays visible-as-stale on the other instance until its 5s local TTL expires. One
  # instance can never show that window. availableSeats is unaffected either way -- overlayLiveSeats
  # re-reads it from Redis on every return and never trusts a cache tier for it.
  match-catalog-service-1:
    <<: *match-catalog-service
    container_name: match-catalog-service-1_stadium_booking
    ports:
      # Direct access, bypassing the load balancer -- for asking one specific instance what it
      # currently believes while measuring that divergence window. Host port is
      # <instance number><the service's own port>, so a third instance would be 38082.
      - "18082:8082"
    environment:
      <<: *match-catalog-service-env
      # Turns on the ECS JSON log file Logstash tails; see the logging block in
      # this service's application.yaml for why it is set here and not there.
      # Per instance, never shared: two JVMs appending to one file interleave half-written
      # JSON lines and both apply their own rolling policy to it.
      LOGGING_FILE_NAME: /var/log/app/match-catalog-service-1.log

  # ---- match-catalog-service, instance 2 --------------------------------
  match-catalog-service-2:
    <<: *match-catalog-service
    container_name: match-catalog-service-2_stadium_booking
    ports:
      - "28082:8082"
    environment:
      <<: *match-catalog-service-env
      LOGGING_FILE_NAME: /var/log/app/match-catalog-service-2.log

  # ---- match-catalog load balancer --------------------------------------
  # Same construction as ticket-inventory-lb below; see the comment there for why it waits on
  # service_healthy rather than service_started.
  catalog-lb:
    image: nginx:1.27-alpine
    container_name: catalog-lb_stadium_booking
    networks: [stadium-net]
    depends_on:
      match-catalog-service-1:
        condition: service_healthy
      match-catalog-service-2:
        condition: service_healthy
    ports:
      # The host port the single match-catalog-service container used to publish, so nothing
      # outside compose has to change.
      - "8082:8082"
    volumes:
      - ./infra/nginx/catalog-lb.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      # nginx:alpine has BusyBox wget but no curl, unlike the service images.
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8082/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  ticket-inventory-service-1:
    <<: *ticket-inventory-service
    container_name: ticket-inventory-service-1_stadium_booking
    ports:
      # Direct access, bypassing the load balancer -- for hitting one specific instance while
      # debugging ("did instance 2 get any of that load?"). Normal traffic goes to 8087.
      # Host port is <instance number><the service's own port>, so a third instance would be 38083.
      - "18083:8083"
    environment:
      <<: *ticket-inventory-service-env
      # Turns on the ECS JSON log file Logstash tails; see the logging block in
      # this service's application.yaml for why it is set here and not there.
      # Per instance, never shared: two JVMs appending to one file interleave half-written
      # JSON lines and both apply their own rolling policy to it.
      LOGGING_FILE_NAME: /var/log/app/ticket-inventory-service-1.log

  # ---- ticket-inventory-service, instance 2 ----------------------------
  ticket-inventory-service-2:
    <<: *ticket-inventory-service
    container_name: ticket-inventory-service-2_stadium_booking
    ports:
      - "28083:8083"
    environment:
      <<: *ticket-inventory-service-env
      LOGGING_FILE_NAME: /var/log/app/ticket-inventory-service-2.log

  # ---- ticket-inventory load balancer ----------------------------------
  # nginx resolves every hostname in an `upstream` block when it loads its config and exits with
  # "host not found in upstream" if one is missing, so it must not start before the instances
  # exist. Waiting for service_healthy rather than service_started also avoids a window of 502s
  # while the JVMs boot, and costs nothing: nothing depends on this container that did not
  # already wait for inventory to be healthy.
  ticket-inventory-lb:
    image: nginx:1.27-alpine
    container_name: ticket-inventory-lb_stadium_booking
    networks: [stadium-net]
    depends_on:
      ticket-inventory-service-1:
        condition: service_healthy
      ticket-inventory-service-2:
        condition: service_healthy
    ports:
      # Host 8087 avoids clashing with kafka-connect's 8083, and is the same host port the single
      # ticket-inventory-service container used to publish, so nothing outside compose changes.
      - "8087:8083"
    volumes:
      - ./infra/nginx/ticket-inventory-lb.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      # nginx:alpine has BusyBox wget but no curl, unlike the service images.
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8083/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---- payment-service (Stripe charges, refunds) -----------------------
  payment-service:
    build:
      context: ./backend
      dockerfile: payment-service/Dockerfile
    container_name: payment-service_stadium_booking
    networks: [stadium-net]
    depends_on:
      postgres-payment:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Consumes booking.refund.requested (see RefundRequestedConsumer) -- a refund it cannot read
      # is a customer left out of pocket, so this is a hard dependency, not a lazy one.
      kafka:
        condition: service_healthy
    ports:
      - "8084:8084"
    volumes:
      - app_logs:/var/log/app
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8084/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    environment:
      # Turns on the ECS JSON log file Logstash tails; see the logging block in
      # this service's application.yaml for why it is set here and not there.
      LOGGING_FILE_NAME: /var/log/app/payment-service.log
      DB_HOST: postgres-payment
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # payment-service is deliberately NOT in booking-service's depends_on -- booking-service
      # waits on payment-service being healthy, and the reverse edge would be a cycle. This URL
      # only has to resolve at request time, not at boot.
      BOOKING_SERVICE_URL: http://booking-service:8086
      JWT_SECRET: ${JWT_SECRET}
      JWT_PREVIOUS_SECRET: ${JWT_PREVIOUS_SECRET}
      JWT_INTERNAL_SECRET: ${JWT_INTERNAL_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}

  # ---- notification-service (Kafka consumer, transactional email) -----
  notification-service:
    build:
      context: ./backend
      dockerfile: notification-service/Dockerfile
    container_name: notification-service_stadium_booking
    networks: [stadium-net]
    depends_on:
      postgres-notification:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8085:8085"
    volumes:
      - app_logs:/var/log/app
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8085/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    environment:
      # Turns on the ECS JSON log file Logstash tails; see the logging block in
      # this service's application.yaml for why it is set here and not there.
      LOGGING_FILE_NAME: /var/log/app/notification-service.log
      DB_HOST: postgres-notification
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # The verify-email link is opened by the end user's browser, so it must point at the
      # host-mapped port, not identity-service's container DNS name.
      IDENTITY_SERVICE_BASE_URL: http://localhost:8081
      # Same reasoning for the reset-password link, which lands on a frontend page.
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL}
      BREVO_API_KEY: ${BREVO_API_KEY}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL}
      BREVO_SENDER_NAME: ${BREVO_SENDER_NAME}
      JWT_SECRET: ${JWT_SECRET}
      JWT_PREVIOUS_SECRET: ${JWT_PREVIOUS_SECRET}
      JWT_INTERNAL_SECRET: ${JWT_INTERNAL_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}

  # ---- booking-service (saga orchestration) ----------------------------
  # A single instance, unlike ticket-inventory-service above. booking has the same ShedLock and
  # consumer-group machinery, but its contested path -- the Redis idempotency claim on
  # POST /bookings -- sits behind the bookings.idempotency_key unique index, which rejects a
  # duplicate however many instances are running. A second booking instance would verify a
  # guarantee that already holds; a second inventory instance is the only thing standing between a
  # JVM-local lock and a seat sold twice. Only the second is worth the memory here.
  #
  # ShedLock (BookingReconciliationJob, InventoryConfirmationReconciler, OutboxEventCleanupScheduler)
  # and the three Kafka consumer groups still behave exactly as designed; they are simply
  # uncontended, so their guards go unexercised at runtime -- see SchedulerLockIntegrationTest for
  # the unit-level proof.
  booking-service:
    <<: *booking-service
    container_name: booking-service_stadium_booking
    ports:
      - "8086:8086"
    environment:
      <<: *booking-service-env
      # Turns on the ECS JSON log file Logstash tails; see the logging block in
      # this service's application.yaml for why it is set here and not there.
      LOGGING_FILE_NAME: /var/log/app/booking-service.log

  # ---- api-gateway (single entrypoint, JWT validation, rate limiting) --
  api-gateway:
    build:
      context: ./backend
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway_stadium_booking
    networks: [stadium-net]
    depends_on:
      redis:
        condition: service_healthy
      identity-service:
        condition: service_healthy
      # The load balancers, not the instances behind them: a healthy LB already implies both of
      # its instances passed their healthcheck (that is its own depends_on condition).
      catalog-lb:
        condition: service_healthy
      ticket-inventory-lb:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      booking-service:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - app_logs:/var/log/app
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    environment:
      # Turns on the ECS JSON log file Logstash tails; see the logging block in
      # this service's application.yaml for why it is set here and not there.
      LOGGING_FILE_NAME: /var/log/app/api-gateway.log
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      IDENTITY_SERVICE_URL: http://identity-service:8081
      MATCH_CATALOG_SERVICE_URL: http://catalog-lb:8082
      # These two are load balancers fronting two instances each (infra/nginx/*.conf); the rest
      # are single containers addressed by their own DNS name. Spring Cloud Gateway has no
      # service discovery configured, so it only ever knows the one URI it is given -- which is
      # exactly why the nginx hop exists.
      TICKET_INVENTORY_SERVICE_URL: http://ticket-inventory-lb:8083
      PAYMENT_SERVICE_URL: http://payment-service:8084
      NOTIFICATION_SERVICE_URL: http://notification-service:8085
      BOOKING_SERVICE_URL: http://booking-service:8086
      JWT_SECRET: ${JWT_SECRET}
      JWT_PREVIOUS_SECRET: ${JWT_PREVIOUS_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}

  # ---- frontend (React/Vite SPA, built and served via Nginx) -----------
  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the JS bundle at build time — must be reachable from the browser
        # (host-mapped api-gateway port), not api-gateway's container DNS name.
        VITE_API_BASE_URL: http://localhost:8080/api/v1
    container_name: frontend_stadium_booking
    networks: [stadium-net]
    depends_on:
      - api-gateway
    ports:
      - "5173:80"

  # ---- Prometheus (metrics scraping) -----------------------------------
  # Scrapes /actuator/prometheus on every backend service's main API port (see
  # infra/prometheus/prometheus.yml) via each service's container DNS name, since every
  # backend service is now built and run as a container on stadium-net (see above).
  # /actuator/prometheus is deliberately public (no ADMIN JWT required) — see
  # backend/common/.../ActuatorAccessFilter.java — since Prometheus has no user JWT to present.
  prometheus:
    image: prom/prometheus:v3.13.2
    container_name: prometheus_stadium_booking
    networks: [stadium-net]
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ---- Node Exporter (host CPU/memory/disk/network metrics) ------------
  # NOTE (Windows/Mac): Docker Desktop runs containers inside a Linux VM, so the /proc,
  # /sys, / mounts below report metrics for that VM, not the raw Windows/Mac host. On a
  # native Linux host this reports the real host machine.
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node_exporter_stadium_booking
    networks: [stadium-net]
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    ports:
      - "9100:9100"

  # ---- Grafana (dashboards over Prometheus) ----------------------------
  grafana:
    image: grafana/grafana:13.1.1
    container_name: grafana_stadium_booking
    networks: [stadium-net]
    depends_on:
      prometheus:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      # No fallback default: "admin"/"admin" is a well-known weak default that must never ship,
      # even in local dev — set GRAFANA_ADMIN_USER/GRAFANA_ADMIN_PASSWORD in .env.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
