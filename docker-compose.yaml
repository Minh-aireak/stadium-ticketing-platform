version: "3.9"

# =============================================================================
# Stadium Ticketing Platform — Local Development Infrastructure
# =============================================================================
# Usage: docker compose up -d
# Services use internal 'stadium-net' network.
# =============================================================================

networks:
  stadium-net:
    driver: bridge

volumes:
  postgres_identity:
  postgres_inventory:
  postgres_booking:
  postgres_payment:
  postgres_catalog:
  redis_data:
  kafka_data:
  zookeeper_data:
  elasticsearch_data:

services:

  # ---- PostgreSQL — identity-service -----------------------------------
  # wal_level=logical is required for Debezium's CDC connector to read the
  # outbox_events table via logical replication (see infra/debezium/).
  postgres-identity:
    image: postgres:16-alpine
    container_name: postgres-identity
    command: ["postgres", "-c", "wal_level=logical"]
    networks: [stadium-net]
    environment:
      POSTGRES_DB: identity_db
      POSTGRES_USER: aireak
      POSTGRES_PASSWORD: aireak
    ports:
      - "5432:5432"
    volumes:
      - postgres_identity:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aireak -d identity_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- PostgreSQL — ticket-inventory-service ----------------------------
  # wal_level=logical is required for Debezium's CDC connector to read the
  # outbox_events table via logical replication (see infra/debezium/).
  postgres-inventory:
    image: postgres:16-alpine
    container_name: postgres-inventory
    command: ["postgres", "-c", "wal_level=logical"]
    networks: [stadium-net]
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: aireak
      POSTGRES_PASSWORD: aireak
    ports:
      - "5433:5432"
    volumes:
      - postgres_inventory:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aireak -d inventory_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- PostgreSQL — booking-service ------------------------------------
  # wal_level=logical is required for Debezium's CDC connector to read the
  # outbox_events table via logical replication (see infra/debezium/).
  postgres-booking:
    image: postgres:16-alpine
    container_name: postgres-booking
    command: ["postgres", "-c", "wal_level=logical"]
    networks: [stadium-net]
    environment:
      POSTGRES_DB: booking_db
      POSTGRES_USER: aireak
      POSTGRES_PASSWORD: aireak
    ports:
      - "5434:5432"
    volumes:
      - postgres_booking:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aireak -d booking_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- PostgreSQL — payment-service ------------------------------------
  postgres-payment:
    image: postgres:16-alpine
    container_name: postgres-payment
    networks: [stadium-net]
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: aireak
      POSTGRES_PASSWORD: aireak
    ports:
      - "5435:5432"
    volumes:
      - postgres_payment:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aireak -d payment_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- PostgreSQL — match-catalog-service ------------------------------
  postgres-catalog:
    image: postgres:16-alpine
    container_name: postgres-catalog
    networks: [stadium-net]
    environment:
      POSTGRES_DB: catalog_db
      POSTGRES_USER: aireak
      POSTGRES_PASSWORD: aireak
    ports:
      - "5436:5432"
    volumes:
      - postgres_catalog:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aireak -d catalog_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Redis (Redisson distributed lock + cache) -----------------------
  redis:
    image: redis:7-alpine
    container_name: redis
    networks: [stadium-net]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Zookeeper (Kafka dependency) ------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    networks: [stadium-net]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Kafka -----------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    networks: [stadium-net]
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ---- Kafka Connect + Debezium (CDC from outbox tables to Kafka) ------
  # Register connectors after startup, e.g.:
  #   curl -X POST -H "Content-Type: application/json" \
  #     --data @identity-service/infra/debezium/identity-outbox-connector.json \
  #     http://localhost:8083/connectors
  #   curl -X POST -H "Content-Type: application/json" \
  #     --data @booking-service/infra/debezium/booking-outbox-connector.json \
  #     http://localhost:8083/connectors
  #   curl -X POST -H "Content-Type: application/json" \
  #     --data @ticket-inventory-service/infra/debezium/inventory-outbox-connector.json \
  #     http://localhost:8083/connectors
  kafka-connect:
    image: debezium/connect:2.7
    container_name: kafka-connect
    networks: [stadium-net]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: identity-outbox-connect
      CONFIG_STORAGE_TOPIC: _identity_connect_configs
      OFFSET_STORAGE_TOPIC: _identity_connect_offsets
      STATUS_STORAGE_TOPIC: _identity_connect_status
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ---- Elasticsearch (match catalog read model) ------------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: elasticsearch
    networks: [stadium-net]
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q 'green\\|yellow'"]
      interval: 20s
      timeout: 10s
      retries: 10

  # ---- Kafka UI (optional dev tool) -----------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    networks: [stadium-net]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    profiles:
      - tools
