spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      server:
        webflux:
          # Connection to downstream services must never hang indefinitely.
          httpclient:
            connect-timeout: 5000 # ms
            response-timeout: 10s
          # Applies to every route unless overridden by that route's own `filters:` list.
          default-filters:
            - name: RequestSize
              args:
                maxSize: 1MB
          routes:
            - id: identity-service
              uri: ${IDENTITY_SERVICE_URL}
              predicates:
                - Path=/api/v1/auth/**
            - id: match-catalog-service
              uri: ${MATCH_CATALOG_SERVICE_URL}
              predicates:
                - Path=/api/v1/matches/**
            - id: ticket-inventory-service
              uri: ${TICKET_INVENTORY_SERVICE_URL}
              predicates:
                - Path=/api/v1/inventory/**
            - id: payment-service
              uri: ${PAYMENT_SERVICE_URL}
              predicates:
                - Path=/api/v1/payments/**
              # Payment payloads are a card token + amount + currency + idempotency key — a few
              # hundred KB is already generous; anything larger is not a legitimate payment call.
              filters:
                - name: RequestSize
                  args:
                    maxSize: 100KB
            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URL}
              predicates:
                - Path=/api/v1/notifications/**
            - id: booking-service
              uri: ${BOOKING_SERVICE_URL}
              predicates:
                - Path=/api/v1/bookings/**
              # Booking payloads (seat selection + holder info) are small JSON, not uploads.
              filters:
                - name: RequestSize
                  args:
                    maxSize: 200KB

server:
  port: 8080

# Must match identity-service's jwt.secret/issuer/audience exactly — same shared HMAC secret,
# injected via env var in every deployment, never hard-coded.
jwt:
  secret: ${JWT_SECRET}
  issuer: ${JWT_ISSUER}
  audience: ${JWT_AUDIENCE}
  public-paths:
    - /api/v1/auth/register
    - /api/v1/auth/login
    - /api/v1/auth/refresh
    - /api/v1/auth/logout
    - /api/v1/matches/**
    - /actuator/health
    - /actuator/info

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway
  endpoint:
    health:
      # "always" leaked DB/broker connection details to any anonymous caller. This service has no
      # Spring Security filter chain, so "when-authorized" fails closed (no request is ever
      # recognized as authorized) rather than actually showing details to ADMIN callers — safe,
      # but not the same guarantee this property gives on services that do run Spring Security
      # (see identity-service). /actuator/metrics and /actuator/gateway are separately enforced
      # in code by ActuatorAccessWebFilter, since Boot has no equivalent "roles" property for
      # non-health endpoints.
      show-details: when-authorized
      roles: ADMIN

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{correlationId}] %-5level %logger{36} - %msg%n"
