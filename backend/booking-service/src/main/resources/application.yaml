spring:
  application:
    name: booking-service

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/booking_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: BookingHikariPool
      maximum-pool-size: 20
      minimum-idle: 10
      connection-timeout: 3000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:30000}
      lettuce:
        pool:
          max-active: ${REDIS_LETTUCE_POOL_MAX_ACTIVE:8}
          max-idle: ${REDIS_LETTUCE_POOL_MAX_IDLE:8}
          min-idle: ${REDIS_LETTUCE_POOL_MIN_IDLE:0}
          max-wait: ${REDIS_LETTUCE_POOL_MAX_WAIT:-1ms}

server:
  port: 8086
  tomcat:
    accept-count: 100

jwt:
  secret: ${JWT_SECRET}
  previous-secret: ${JWT_PREVIOUS_SECRET}
  internal-secret: ${JWT_INTERNAL_SECRET}
  issuer: ${JWT_ISSUER}
  audience: ${JWT_AUDIENCE}
  excluded-paths:
    - /actuator/health
    - /actuator/info
    - /actuator/prometheus
    - /v3/api-docs/**
    - /swagger-ui/**
    - /swagger-ui.html

services:
  ticket-inventory:
    base-url: ${TICKET_INVENTORY_SERVICE_URL}
  payment:
    base-url: ${PAYMENT_SERVICE_URL}

booking:
  inventory-confirmation-reconciler:
    grace-minutes: ${INVENTORY_RECONCILER_GRACE_MINUTES:5}
    fixed-delay-ms: ${INVENTORY_RECONCILER_FIXED_DELAY_MS:300000}
    batch-size: ${INVENTORY_RECONCILER_BATCH_SIZE:200}
  payment-reconciliation-job:
    grace-minutes: ${PAYMENT_RECONCILER_GRACE_MINUTES:5}
    fixed-delay-ms: ${PAYMENT_RECONCILER_FIXED_DELAY_MS:300000}
    batch-size: ${PAYMENT_RECONCILER_BATCH_SIZE:200}

outbox:
  cleanup:
    retention-days: ${OUTBOX_CLEANUP_RETENTION_DAYS:14}
    fixed-delay-ms: ${OUTBOX_CLEANUP_FIXED_DELAY_MS:86400000}

resilience4j:
  circuitbreaker:
    instances:
      ticket-inventory:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        ignoreExceptions:
          - io.github.resilience4j.bulkhead.BulkheadFullException
      payment:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        ignoreExceptions:
          - io.github.resilience4j.bulkhead.BulkheadFullException
  bulkhead:
    instances:
      ticket-inventory:
        maxConcurrentCalls: 50
        maxWaitDuration: 0
      payment:
        maxConcurrentCalls: 50
        maxWaitDuration: 0
  retry:
    instances:
      ticket-inventory:
        maxAttempts: 3
        waitDuration: 500ms
        ignoreExceptions:
          # 4xx: caller error, retrying won't help.
          - org.springframework.web.client.HttpClientErrorException
          # 503: downstream is explicitly shedding load — retrying just adds to the pile-on.
          - org.springframework.web.client.HttpServerErrorException$ServiceUnavailable
          # Bulkhead already full locally — an immediate retry has zero chance of a free slot.
          - io.github.resilience4j.bulkhead.BulkheadFullException
      payment:
        maxAttempts: 3
        waitDuration: 500ms
        ignoreExceptions:
          - org.springframework.web.client.HttpClientErrorException
          - org.springframework.web.client.HttpServerErrorException$ServiceUnavailable
          - io.github.resilience4j.bulkhead.BulkheadFullException

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers,bulkheads,ratelimiters,prometheus
  endpoint:
    health:
      show-details: when-authorized

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{correlationId}] %-5level %logger{36} - %msg%n"
