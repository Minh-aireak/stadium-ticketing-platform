spring:
  application:
    name: booking-service

  threads:
    virtual:
      enabled: true

  lifecycle:
    # Bounds the graceful shutdown configured under server: below. Spring waits this long for
    # in-flight work -- HTTP requests and the Kafka listener containers alike -- before forcing the
    # rest down. Comfortably clear of anything holding the 10s seat lock, and deliberately below
    # docker-compose's stop_grace_period, which has to outlast it or SIGKILL lands mid-drain.
    timeout-per-shutdown-phase: 30s

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/booking_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: BookingHikariPool
      maximum-pool-size: 20
      minimum-idle: 10
      connection-timeout: 3000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:30000}
      # No lettuce.pool.* here: redisson-spring-boot-starter excludes lettuce-core and nothing
      # else brings commons-pool2, so Redisson is the only Redis client in this platform and
      # manages its own connection pool. The four properties that used to sit here were read by
      # nothing. What does reach Redisson is the per-command budget in RedissonCommandBudgetConfig
      # (redis.command.timeout-ms / redis.command.retry-attempts), overridable here per service.

server:
  port: 8086
  # Finish in-flight requests instead of dropping them when the container stops. This service runs
  # a single instance, so a restart is a real outage either way -- but a saga cut off mid-step
  # leaves a booking for the reconcilers to clean up, and draining first avoids manufacturing that
  # work on every restart.
  shutdown: graceful
  tomcat:
    accept-count: 100

jwt:
  secret: ${JWT_SECRET}
  previous-secret: ${JWT_PREVIOUS_SECRET}
  internal-secret: ${JWT_INTERNAL_SECRET}
  issuer: ${JWT_ISSUER}
  audience: ${JWT_AUDIENCE}
  excluded-paths:
    - /actuator/health
    - /actuator/info
    - /actuator/prometheus

services:
  ticket-inventory:
    base-url: ${TICKET_INVENTORY_SERVICE_URL}
  payment:
    base-url: ${PAYMENT_SERVICE_URL}

booking:
  inventory-confirmation-reconciler:
    grace-minutes: ${INVENTORY_RECONCILER_GRACE_MINUTES:5}
    fixed-delay-ms: ${INVENTORY_RECONCILER_FIXED_DELAY_MS:300000}
    batch-size: ${INVENTORY_RECONCILER_BATCH_SIZE:200}
  payment-reconciliation-job:
    grace-minutes: ${PAYMENT_RECONCILER_GRACE_MINUTES:5}
    fixed-delay-ms: ${PAYMENT_RECONCILER_FIXED_DELAY_MS:300000}
    batch-size: ${PAYMENT_RECONCILER_BATCH_SIZE:200}

outbox:
  cleanup:
    retention-days: ${OUTBOX_CLEANUP_RETENTION_DAYS:14}
    fixed-delay-ms: ${OUTBOX_CLEANUP_FIXED_DELAY_MS:86400000}

resilience4j:
  circuitbreaker:
    instances:
      ticket-inventory:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        ignoreExceptions:
          - io.github.resilience4j.bulkhead.BulkheadFullException
      payment:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        ignoreExceptions:
          - io.github.resilience4j.bulkhead.BulkheadFullException
  bulkhead:
    instances:
      ticket-inventory:
        maxConcurrentCalls: 50
        maxWaitDuration: 0
      payment:
        maxConcurrentCalls: 50
        maxWaitDuration: 0
  retry:
    instances:
      ticket-inventory:
        maxAttempts: 3
        waitDuration: 500ms
        ignoreExceptions:
          # 4xx: caller error, retrying won't help.
          - org.springframework.web.client.HttpClientErrorException
          # 503: downstream is explicitly shedding load — retrying just adds to the pile-on.
          - org.springframework.web.client.HttpServerErrorException$ServiceUnavailable
          # Bulkhead already full locally — an immediate retry has zero chance of a free slot.
          - io.github.resilience4j.bulkhead.BulkheadFullException
      payment:
        maxAttempts: 3
        waitDuration: 500ms
        ignoreExceptions:
          - org.springframework.web.client.HttpClientErrorException
          - org.springframework.web.client.HttpServerErrorException$ServiceUnavailable
          - io.github.resilience4j.bulkhead.BulkheadFullException

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers,bulkheads,ratelimiters,prometheus
  endpoint:
    health:
      show-details: when-authorized

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{correlationId}] %-5level %logger{36} - %msg%n"
  # Console stays human-readable for `docker compose logs`. ECS is Spring Boot's own built-in
  # structured format (logging.structured.*), so shipping logs to Elasticsearch needs no logging
  # appender library here — service.name defaults to spring.application.name and the correlationId
  # MDC entry rides along as a top-level field.
  #
  # It applies to the log FILE only, and the file itself is opt-in: docker-compose.yaml sets
  # LOGGING_FILE_NAME to a path on the shared app_logs volume, which is what Logstash tails
  # (infra/logstash/pipeline/logstash.conf). Left unset outside Docker on purpose, so local runs
  # and tests keep logging to the console instead of littering the working directory.
  structured:
    format:
      file: ecs
  logback:
    rollingpolicy:
      # app_logs is shared by all 7 services, so cap each one's footprint. Rolled files are named
      # *.log.<date>.<i>.gz and deliberately fall outside Logstash's *.log glob.
      max-file-size: 10MB
      total-size-cap: 200MB
      max-history: 3
