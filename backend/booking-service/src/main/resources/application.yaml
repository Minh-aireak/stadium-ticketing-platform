spring:
  application:
    name: booking-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/booking_db
    username: ${DB_USERNAME:aireak}
    password: ${DB_PASSWORD:aireak}
    driver-class-name: org.postgresql.Driver
    # Explicit pool size: every step in BookingSagaSteps is a short REQUIRES_NEW transaction that
    # never spans the outbound REST calls (see BookingOrchestrationService), so a connection is
    # only ever held for a single insert/update — this pool no longer needs to cover network wait.
    hikari:
      pool-name: BookingHikariPool
      maximum-pool-size: 20
      minimum-idle: 10
      connection-timeout: 3000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6319}
      password: ${REDIS_PASSWORD:}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:30000}
      # Redisson (RedissonIdempotencyStore + distributed lock), not Spring Data's Lettuce client,
      # is what actually talks to Redis here — it manages its own connection pool and does not
      # read these lettuce.pool.* properties. Kept for consistency with the other services.
      lettuce:
        pool:
          max-active: ${REDIS_LETTUCE_POOL_MAX_ACTIVE:8}
          max-idle: ${REDIS_LETTUCE_POOL_MAX_IDLE:8}
          min-idle: ${REDIS_LETTUCE_POOL_MIN_IDLE:0}
          max-wait: ${REDIS_LETTUCE_POOL_MAX_WAIT:-1ms}

server:
  port: 8086
  tomcat:
    threads:
      # Kept above the sum of the ticket-inventory/payment Bulkhead limits (50+50=100) so a
      # rejected call fails fast at the Bulkhead instead of also queueing at the Tomcat level.
      max: 200
      min-spare: 20
    accept-count: 100

# Must match identity-service's jwt.secret/issuer/audience exactly — validated independently
# here so this service is never unauthenticated just because a caller bypassed api-gateway.
jwt:
  secret: ${JWT_SECRET}
  # Set only during a secret rotation window — see docs/secrets_management_strategy.md.
  previous-secret: ${JWT_PREVIOUS_SECRET:}
  # Distinct secret for service-to-service tokens (see InternalServiceTokenProvider) — never
  # accepted for user-issued tokens or vice versa.
  internal-secret: ${JWT_INTERNAL_SECRET:}
  issuer: ${JWT_ISSUER:https://auth.aireak.com}
  audience: ${JWT_AUDIENCE:aireak-platform}
  excluded-paths:
    - /actuator/health
    - /actuator/info
    # Prometheus has no user JWT to present — public here for the same reason health/info are.
    - /actuator/prometheus
    - /v3/api-docs/**
    - /swagger-ui/**
    - /swagger-ui.html

# Downstream service URLs
services:
  ticket-inventory:
    base-url: ${TICKET_INVENTORY_SERVICE_URL:http://localhost:8083}
  payment:
    base-url: ${PAYMENT_SERVICE_URL:http://localhost:8084}

booking:
  inventory-confirmation-reconciler:
    # Only retry CONFIRMED bookings whose inventory confirm is still unresolved after this
    # long, so the job never races the synchronous attempt in confirmBooking().
    grace-minutes: ${INVENTORY_RECONCILER_GRACE_MINUTES:5}
    fixed-delay-ms: ${INVENTORY_RECONCILER_FIXED_DELAY_MS:300000}
    # Caps how many bookings a single run retries — a real backlog drains over several cycles.
    batch-size: ${INVENTORY_RECONCILER_BATCH_SIZE:200}
  payment-reconciliation-job:
    # Only reconcile PENDING_PAYMENT bookings still unresolved after this long, so the job never
    # races the normal in-flight case (payment-service simply hasn't responded to Kafka yet).
    grace-minutes: ${PAYMENT_RECONCILER_GRACE_MINUTES:5}
    fixed-delay-ms: ${PAYMENT_RECONCILER_FIXED_DELAY_MS:300000}
    # Caps how many bookings a single run retries — a real backlog drains over several cycles.
    batch-size: ${PAYMENT_RECONCILER_BATCH_SIZE:200}

outbox:
  cleanup:
    # Debezium reads outbox_events via WAL, not the table itself — rows older than this are
    # safe to purge regardless of whether CDC has "processed" them.
    retention-days: ${OUTBOX_CLEANUP_RETENTION_DAYS:14}
    fixed-delay-ms: ${OUTBOX_CLEANUP_FIXED_DELAY_MS:86400000}

# Resilience4j: CircuitBreaker + Retry + Bulkhead on outbound REST calls to
# ticket-inventory-service and payment-service.
resilience4j:
  circuitbreaker:
    instances:
      ticket-inventory:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        # A Bulkhead rejection reflects OUR OWN concurrency cap, not the downstream's health —
        # must not count toward tripping this circuit open.
        ignoreExceptions:
          - io.github.resilience4j.bulkhead.BulkheadFullException
      payment:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        ignoreExceptions:
          - io.github.resilience4j.bulkhead.BulkheadFullException
  bulkhead:
    instances:
      # Caps concurrent in-flight calls to each downstream so one slow dependency can never
      # consume every Tomcat thread handling createBooking(); overflow fails fast instead of
      # queueing (maxWaitDuration: 0).
      ticket-inventory:
        maxConcurrentCalls: 50
        maxWaitDuration: 0
      payment:
        maxConcurrentCalls: 50
        maxWaitDuration: 0
  retry:
    instances:
      ticket-inventory:
        maxAttempts: 3
        waitDuration: 500ms
        ignoreExceptions:
          # 4xx: caller error, retrying won't help.
          - org.springframework.web.client.HttpClientErrorException
          # 503: downstream is explicitly shedding load — retrying just adds to the pile-on.
          - org.springframework.web.client.HttpServerErrorException$ServiceUnavailable
          # Bulkhead already full locally — an immediate retry has zero chance of a free slot.
          - io.github.resilience4j.bulkhead.BulkheadFullException
      payment:
        maxAttempts: 3
        waitDuration: 500ms
        ignoreExceptions:
          - org.springframework.web.client.HttpClientErrorException
          - org.springframework.web.client.HttpServerErrorException$ServiceUnavailable
          - io.github.resilience4j.bulkhead.BulkheadFullException

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers,bulkheads,ratelimiters,prometheus
  endpoint:
    health:
      show-details: when-authorized

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{correlationId}] %-5level %logger{36} - %msg%n"
