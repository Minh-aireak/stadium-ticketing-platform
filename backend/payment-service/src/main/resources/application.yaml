spring:
  application:
    name: payment-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5435}/payment_db
    username: ${DB_USERNAME:aireak}
    password: ${DB_PASSWORD:aireak}
    driver-class-name: org.postgresql.Driver
    # Explicit pool size: PaymentSagaSteps commits INITIATED/SUCCEEDED/FAILED as short, independent
    # REQUIRES_NEW transactions around the gateway call (see PaymentService), so a connection is
    # never held while waiting on the gateway — this pool only covers the DB writes themselves.
    hikari:
      pool-name: PaymentHikariPool
      maximum-pool-size: 20
      minimum-idle: 10
      connection-timeout: 3000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6319}
      password: ${REDIS_PASSWORD:}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:30000}
      # Redisson (RedissonPaymentIdempotencyAdapter), not Spring Data's Lettuce client, is what
      # actually talks to Redis here — it manages its own connection pool and does not read
      # these lettuce.pool.* properties. Kept for consistency with the other services.
      lettuce:
        pool:
          max-active: ${REDIS_LETTUCE_POOL_MAX_ACTIVE:8}
          max-idle: ${REDIS_LETTUCE_POOL_MAX_IDLE:8}
          min-idle: ${REDIS_LETTUCE_POOL_MIN_IDLE:0}
          max-wait: ${REDIS_LETTUCE_POOL_MAX_WAIT:-1ms}

server:
  port: 8084
  tomcat:
    threads:
      # Kept above the payment-gateway Bulkhead limit (30) so a rejected call fails fast at the
      # Bulkhead instead of also queueing at the Tomcat level.
      max: 200
      min-spare: 20
    accept-count: 100

# Must match identity-service's jwt.secret/issuer/audience exactly — validated independently
# here so this service is never unauthenticated just because a caller bypassed api-gateway.
jwt:
  secret: ${JWT_SECRET}
  # Set only during a secret rotation window — see docs/secrets_management_strategy.md.
  previous-secret: ${JWT_PREVIOUS_SECRET:}
  # Distinct secret for service-to-service tokens (see InternalServiceTokenProvider) — never
  # accepted for user-issued tokens or vice versa.
  internal-secret: ${JWT_INTERNAL_SECRET:}
  issuer: ${JWT_ISSUER:https://auth.aireak.com}
  audience: ${JWT_AUDIENCE:aireak-platform}
  excluded-paths:
    - /actuator/health
    - /actuator/info
    # Prometheus has no user JWT to present — public here for the same reason health/info are.
    - /actuator/prometheus
    - /v3/api-docs/**
    - /swagger-ui/**
    - /swagger-ui.html
    # Stripe calls this directly — authenticated by Stripe-Signature (see StripeWebhookController),
    # not a platform JWT, since Stripe is not a logged-in user.
    - "POST:/api/v1/payments/webhook"

services:
  booking:
    base-url: ${BOOKING_SERVICE_URL:http://localhost:8083}

stripe:
  # No default — must be injected via env var (STRIPE_SECRET_KEY), same rationale as jwt.secret.
  secret-key: ${STRIPE_SECRET_KEY}
  # Signing secret for the webhook endpoint (Stripe CLI/Dashboard-issued, starts with "whsec_").
  # No default — same rationale as jwt.secret: a hardcoded fallback would let anyone who reads
  # the source forge webhook deliveries.
  webhook-secret: ${STRIPE_WEBHOOK_SECRET}
  # Fixed Stripe test PaymentMethod: frontend doesn't collect real card details yet, so every
  # charge in this environment uses this stand-in token (only valid against a test-mode secret key).
  test-payment-method: ${STRIPE_TEST_PAYMENT_METHOD:pm_card_visa}
  # SDK defaults (30s/80s) are too long to hold a Tomcat thread + Bulkhead permit on a bad
  # network — shortened so a stalled call fails fast into Retry/CircuitBreaker.
  connect-timeout-ms: ${STRIPE_CONNECT_TIMEOUT_MS:5000}
  read-timeout-ms: ${STRIPE_READ_TIMEOUT_MS:10000}

outbox:
  cleanup:
    # Debezium reads outbox_events via WAL, not the table itself — rows older than this are
    # safe to purge regardless of whether CDC has "processed" them.
    retention-days: ${OUTBOX_CLEANUP_RETENTION_DAYS:14}
    fixed-delay-ms: ${OUTBOX_CLEANUP_FIXED_DELAY_MS:86400000}

resilience4j:
  circuitbreaker:
    instances:
      payment-gateway:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 2
        ignoreExceptions:
          # A Bulkhead rejection reflects OUR OWN concurrency cap, not the gateway's health — must
          # not count toward tripping this circuit open.
          - io.github.resilience4j.bulkhead.BulkheadFullException
          # A card decline is a business outcome, not a gateway fault — many declines in a row
          # (e.g. a fraud wave) must not trip the breaker and block unrelated bookings.
          - com.aireak.payment.adapter.out.gateway.PaymentDeclinedException
  bulkhead:
    instances:
      # Caps concurrent in-flight gateway calls so a slow gateway can't consume every Tomcat
      # thread handling PaymentService#execute; overflow fails fast (maxWaitDuration: 0).
      payment-gateway:
        maxConcurrentCalls: 30
        maxWaitDuration: 0
  retry:
    instances:
      payment-gateway:
        maxAttempts: 2
        waitDuration: 1s
        ignoreExceptions:
          # Card declined / bad request: a business outcome, not a transient gateway fault —
          # retrying would just replay the identical Stripe-cached decline for this Idempotency-Key.
          - com.aireak.payment.adapter.out.gateway.PaymentDeclinedException
          # Bulkhead already full locally — an immediate retry has zero chance of a free slot.
          - io.github.resilience4j.bulkhead.BulkheadFullException

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers,bulkheads,ratelimiters,prometheus
  endpoint:
    health:
      show-details: when-authorized

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{correlationId}] %-5level %logger{36} - %msg%n"
