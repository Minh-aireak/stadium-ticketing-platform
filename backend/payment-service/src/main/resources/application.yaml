spring:
  application:
    name: payment-service

  datasource:
    url: jdbc:postgresql://localhost:5432/payment_db
    username: ${DB_USERNAME:aireak}
    password: ${DB_PASSWORD:aireak}
    driver-class-name: org.postgresql.Driver
    # Explicit pool size: PaymentSagaSteps commits INITIATED/SUCCEEDED/FAILED as short, independent
    # REQUIRES_NEW transactions around the gateway call (see PaymentService), so a connection is
    # never held while waiting on the gateway — this pool only covers the DB writes themselves.
    hikari:
      pool-name: PaymentHikariPool
      maximum-pool-size: 20
      minimum-idle: 10
      connection-timeout: 3000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8084
  tomcat:
    threads:
      # Kept above the payment-gateway Bulkhead limit (30) so a rejected call fails fast at the
      # Bulkhead instead of also queueing at the Tomcat level.
      max: 200
      min-spare: 20
    accept-count: 100

# Must match identity-service's jwt.secret/issuer/audience exactly — validated independently
# here so this service is never unauthenticated just because a caller bypassed api-gateway.
jwt:
  # No default — must be injected via env var in every environment. A hardcoded fallback here
  # would let anyone who reads the source mint valid tokens if the env var is ever left unset.
  secret: ${JWT_SECRET}
  issuer: ${JWT_ISSUER:https://auth.aireak.com}
  audience: ${JWT_AUDIENCE:aireak-platform}
  excluded-paths:
    - /actuator/**

outbox:
  cleanup:
    # Debezium reads outbox_events via WAL, not the table itself — rows older than this are
    # safe to purge regardless of whether CDC has "processed" them.
    retention-days: ${OUTBOX_CLEANUP_RETENTION_DAYS:14}
    fixed-delay-ms: ${OUTBOX_CLEANUP_FIXED_DELAY_MS:86400000}

resilience4j:
  circuitbreaker:
    instances:
      payment-gateway:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 2
        # A Bulkhead rejection reflects OUR OWN concurrency cap, not the gateway's health — must
        # not count toward tripping this circuit open.
        ignoreExceptions:
          - io.github.resilience4j.bulkhead.BulkheadFullException
  bulkhead:
    instances:
      # Caps concurrent in-flight gateway calls so a slow gateway can't consume every Tomcat
      # thread handling PaymentService#execute; overflow fails fast (maxWaitDuration: 0).
      payment-gateway:
        maxConcurrentCalls: 30
        maxWaitDuration: 0
  retry:
    instances:
      payment-gateway:
        maxAttempts: 2
        waitDuration: 1s
        ignoreExceptions:
          # 4xx: caller error, retrying won't help.
          - org.springframework.web.client.HttpClientErrorException
          # 503: gateway is explicitly shedding load — retrying just adds to the pile-on.
          - org.springframework.web.client.HttpServerErrorException$ServiceUnavailable
          # Bulkhead already full locally — an immediate retry has zero chance of a free slot.
          - io.github.resilience4j.bulkhead.BulkheadFullException

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers,bulkheads,ratelimiters
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{correlationId}] %-5level %logger{36} - %msg%n"
