spring:
  application:
    name: payment-service

  threads:
    virtual:
      enabled: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/payment_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: PaymentHikariPool
      maximum-pool-size: 20
      minimum-idle: 10
      connection-timeout: 3000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:30000}
      # No lettuce.pool.* here: redisson-spring-boot-starter excludes lettuce-core and nothing
      # else brings commons-pool2, so Redisson is the only Redis client in this platform and
      # manages its own connection pool. The four properties that used to sit here were read by
      # nothing. What does reach Redisson is the per-command budget in RedissonCommandBudgetConfig
      # (redis.command.timeout-ms / redis.command.retry-attempts), overridable here per service.

server:
  port: 8084
  tomcat:
    accept-count: 100

jwt:
  secret: ${JWT_SECRET}
  previous-secret: ${JWT_PREVIOUS_SECRET}
  internal-secret: ${JWT_INTERNAL_SECRET}
  issuer: ${JWT_ISSUER}
  audience: ${JWT_AUDIENCE}
  excluded-paths:
    - /actuator/health
    - /actuator/info
    - /actuator/prometheus
    - "POST:/api/v1/payments/webhook"

services:
  booking:
    base-url: ${BOOKING_SERVICE_URL}

stripe:
  secret-key: ${STRIPE_SECRET_KEY}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET}
  test-payment-method: ${STRIPE_TEST_PAYMENT_METHOD:pm_card_visa}
  connect-timeout-ms: ${STRIPE_CONNECT_TIMEOUT_MS:5000}
  read-timeout-ms: ${STRIPE_READ_TIMEOUT_MS:10000}

outbox:
  cleanup:
    retention-days: ${OUTBOX_CLEANUP_RETENTION_DAYS:14}
    fixed-delay-ms: ${OUTBOX_CLEANUP_FIXED_DELAY_MS:86400000}

resilience4j:
  circuitbreaker:
    instances:
      payment-gateway:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 2
        ignoreExceptions:
          # A Bulkhead rejection reflects OUR OWN concurrency cap, not the gateway's health — must
          # not count toward tripping this circuit open.
          - io.github.resilience4j.bulkhead.BulkheadFullException
          # A card decline is a business outcome, not a gateway fault — many declines in a row
          # (e.g. a fraud wave) must not trip the breaker and block unrelated bookings.
          - com.aireak.payment.application.port.out.PaymentDeclinedException
  bulkhead:
    instances:
      # Caps concurrent in-flight gateway calls so a slow gateway can't consume every Tomcat
      # thread handling PaymentService#execute; overflow fails fast (maxWaitDuration: 0).
      payment-gateway:
        maxConcurrentCalls: 30
        maxWaitDuration: 0
  retry:
    instances:
      payment-gateway:
        maxAttempts: 2
        waitDuration: 1s
        ignoreExceptions:
          # Card declined / bad request: a business outcome, not a transient gateway fault —
          # retrying would just replay the identical Stripe-cached decline for this Idempotency-Key.
          - com.aireak.payment.application.port.out.PaymentDeclinedException
          # Bulkhead already full locally — an immediate retry has zero chance of a free slot.
          - io.github.resilience4j.bulkhead.BulkheadFullException

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers,bulkheads,ratelimiters,prometheus
  endpoint:
    health:
      show-details: when-authorized

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{correlationId}] %-5level %logger{36} - %msg%n"
  # Console stays human-readable for `docker compose logs`. ECS is Spring Boot's own built-in
  # structured format (logging.structured.*), so shipping logs to Elasticsearch needs no logging
  # appender library here — service.name defaults to spring.application.name and the correlationId
  # MDC entry rides along as a top-level field.
  #
  # It applies to the log FILE only, and the file itself is opt-in: docker-compose.yaml sets
  # LOGGING_FILE_NAME to a path on the shared app_logs volume, which is what Logstash tails
  # (infra/logstash/pipeline/logstash.conf). Left unset outside Docker on purpose, so local runs
  # and tests keep logging to the console instead of littering the working directory.
  structured:
    format:
      file: ecs
  logback:
    rollingpolicy:
      # app_logs is shared by all 7 services, so cap each one's footprint. Rolled files are named
      # *.log.<date>.<i>.gz and deliberately fall outside Logstash's *.log glob.
      max-file-size: 10MB
      total-size-cap: 200MB
      max-history: 3
