spring:
  application:
    name: notification-service

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/notification_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

server:
  port: 8085

app:
  identity-service-base-url: ${IDENTITY_SERVICE_BASE_URL}
  # Base URL the reset-password email links to — a frontend page, since submitting a new password
  # is a POST. Must be browser-reachable, not a docker-internal hostname.
  frontend-base-url: ${FRONTEND_BASE_URL}

brevo:
  # No defaults: a missing key or an unverified sender must fail at startup, not silently at the
  # first send. Sender must be verified in Brevo Dashboard > Senders, Domains & Dedicated IPs.
  api-key: ${BREVO_API_KEY}
  sender-email: ${BREVO_SENDER_EMAIL}
  sender-name: ${BREVO_SENDER_NAME}
  base-url: ${BREVO_BASE_URL:https://api.brevo.com}
  connect-timeout-ms: ${BREVO_CONNECT_TIMEOUT_MS:5000}
  read-timeout-ms: ${BREVO_READ_TIMEOUT_MS:10000}

jwt:
  secret: ${JWT_SECRET}
  previous-secret: ${JWT_PREVIOUS_SECRET}
  internal-secret: ${JWT_INTERNAL_SECRET}
  issuer: ${JWT_ISSUER}
  audience: ${JWT_AUDIENCE}
  excluded-paths:
    - /actuator/health
    - /actuator/info
    - /actuator/prometheus
    - /v3/api-docs/**
    - /swagger-ui/**
    - /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{correlationId}] %-5level %logger{36} - %msg%n"
