spring:
  application:
    name: notification-service

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/notification_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

server:
  port: 8085

app:
  # Base URL the verify-email link points at: api-gateway's public origin, since a deployment
  # exposes the gateway alone and identity-service's own port is not reachable from a mail client.
  # Must be browser-reachable, not a docker-internal hostname.
  public-api-base-url: ${PUBLIC_API_BASE_URL}
  # Base URL the reset-password email links to — a frontend page, since submitting a new password
  # is a POST. Must be browser-reachable, not a docker-internal hostname.
  frontend-base-url: ${FRONTEND_BASE_URL}

brevo:
  # No defaults: a missing key or an unverified sender must fail at startup, not silently at the
  # first send. Sender must be verified in Brevo Dashboard > Senders, Domains & Dedicated IPs.
  api-key: ${BREVO_API_KEY}
  sender-email: ${BREVO_SENDER_EMAIL}
  sender-name: ${BREVO_SENDER_NAME}
  base-url: ${BREVO_BASE_URL:https://api.brevo.com}
  connect-timeout-ms: ${BREVO_CONNECT_TIMEOUT_MS:5000}
  read-timeout-ms: ${BREVO_READ_TIMEOUT_MS:10000}

jwt:
  secret: ${JWT_SECRET}
  previous-secret: ${JWT_PREVIOUS_SECRET}
  internal-secret: ${JWT_INTERNAL_SECRET}
  issuer: ${JWT_ISSUER}
  audience: ${JWT_AUDIENCE}
  excluded-paths:
    - /actuator/health
    - /actuator/info
    - /actuator/prometheus

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{correlationId}] %-5level %logger{36} - %msg%n"
  # Console stays human-readable for `docker compose logs`. ECS is Spring Boot's own built-in
  # structured format (logging.structured.*), so shipping logs to Elasticsearch needs no logging
  # appender library here — service.name defaults to spring.application.name and the correlationId
  # MDC entry rides along as a top-level field.
  #
  # It applies to the log FILE only, and the file itself is opt-in: docker-compose.yaml sets
  # LOGGING_FILE_NAME to a path on the shared app_logs volume, which is what Logstash tails
  # (infra/logstash/pipeline/logstash.conf). Left unset outside Docker on purpose, so local runs
  # and tests keep logging to the console instead of littering the working directory.
  structured:
    format:
      file: ecs
  logback:
    rollingpolicy:
      # app_logs is shared by all 7 services, so cap each one's footprint. Rolled files are named
      # *.log.<date>.<i>.gz and deliberately fall outside Logstash's *.log glob.
      max-file-size: 10MB
      total-size-cap: 200MB
      max-history: 3
