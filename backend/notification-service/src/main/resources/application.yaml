spring:
  application:
    name: notification-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5437}/notification_db
    username: ${DB_USERNAME:aireak}
    password: ${DB_PASSWORD:aireak}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # Only bootstrap-servers is read (via @Value in KafkaConfig) — consumer
  # factory, deserializer, group-id, and error handling are all defined
  # programmatically in KafkaConfig.java, which fully overrides Boot's
  # consumer autoconfiguration.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

  # Redisson config — Redis for distributed lock (spike verification)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8085

app:
  # Base URL embedded in the account-welcome email's verify-email link. Must be reachable by the
  # end user's browser — not identity-service's internal container hostname in a real deployment.
  identity-service-base-url: ${IDENTITY_SERVICE_BASE_URL:http://localhost:8081}

# Must match identity-service's jwt.secret/issuer/audience exactly — validated independently
# here so this service is never unauthenticated just because a caller bypassed api-gateway.
jwt:
  # No default — must be injected via env var in every environment. A hardcoded fallback here
  # would let anyone who reads the source mint valid tokens if the env var is ever left unset.
  secret: ${JWT_SECRET}
  issuer: ${JWT_ISSUER:https://auth.aireak.com}
  audience: ${JWT_AUDIENCE:aireak-platform}
  excluded-paths:
    - /actuator/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{correlationId}] %-5level %logger{36} - %msg%n"
