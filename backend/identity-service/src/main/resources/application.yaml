spring:
  application:
    name: identity-service

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/identity_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    # Pool size stays on Hikari's default of 10; only the wait is overridden. Login is on this pool,
    # and Hikari's default 30s would keep a login waiting for a connection long after api-gateway's
    # 10s response-timeout has already answered the client with a 504.
    hikari:
      connection-timeout: 3000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:30000}
      # No lettuce.pool.* here: redisson-spring-boot-starter excludes lettuce-core and nothing
      # else brings commons-pool2, so Redisson is the only Redis client in this platform and
      # manages its own connection pool. The four properties that used to sit here were read by
      # nothing. What does reach Redisson is the per-command budget in RedissonCommandBudgetConfig
      # (redis.command.timeout-ms / redis.command.retry-attempts), overridable here per service.

server:
  port: 8081

jwt:
  secret: ${JWT_SECRET}
  previous-secret: ${JWT_PREVIOUS_SECRET}
  internal-secret: ${JWT_INTERNAL_SECRET}
  expiration-seconds: ${JWT_EXPIRATION_SECONDS:900}
  issuer: ${JWT_ISSUER}
  audience: ${JWT_AUDIENCE}
  excluded-paths:
    - /api/v1/auth/register
    - /api/v1/auth/login
    - /api/v1/auth/refresh
    - /api/v1/auth/logout
    - /api/v1/auth/verify-email
    - /api/v1/auth/resend-verification
    - /api/v1/auth/forgot-password
    - /api/v1/auth/reset-password
    - /actuator/health
    - /actuator/info
    - /actuator/prometheus

refresh-token:
  absolute-ttl-seconds: ${REFRESH_TOKEN_ABSOLUTE_TTL_SECONDS:2592000}

email-verification:
  # How long the link in the welcome email stays valid; the token is one-time-use regardless.
  ttl-seconds: ${EMAIL_VERIFICATION_TTL_SECONDS:86400}

password-reset:
  # Minutes, not a day: a reset link is a live credential for an existing account. Default 30 min.
  ttl-seconds: ${PASSWORD_RESET_TTL_SECONDS:1800}

login-throttle:
  # Supplements the gateway's per-IP login limit, which an attacker with many addresses walks
  # straight past while aiming at one account. Not a lock: the count expires on its own and a
  # successful login clears it, so no one can shut a real user out by guessing at their email.
  max-failures: ${LOGIN_THROTTLE_MAX_FAILURES:10}
  window-seconds: ${LOGIN_THROTTLE_WINDOW_SECONDS:900}

admin-bootstrap:
  email: ${ADMIN_BOOTSTRAP_EMAIL:}
  password: ${ADMIN_BOOTSTRAP_PASSWORD:}

auth-cookie:
  name: ${AUTH_COOKIE_NAME:refresh_token}
  path: ${AUTH_COOKIE_PATH:/api/v1/auth}
  domain: ${AUTH_COOKIE_DOMAIN:}
  secure: ${AUTH_COOKIE_SECURE:true}
  same-site: ${AUTH_COOKIE_SAME_SITE:Strict}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

outbox:
  cleanup:
    retention-days: ${OUTBOX_CLEANUP_RETENTION_DAYS:14}
    fixed-delay-ms: ${OUTBOX_CLEANUP_FIXED_DELAY_MS:86400000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{correlationId}] %-5level %logger{36} - %msg%n"
  # Console stays human-readable for `docker compose logs`. ECS is Spring Boot's own built-in
  # structured format (logging.structured.*), so shipping logs to Elasticsearch needs no logging
  # appender library here — service.name defaults to spring.application.name and the correlationId
  # MDC entry rides along as a top-level field.
  #
  # It applies to the log FILE only, and the file itself is opt-in: docker-compose.yaml sets
  # LOGGING_FILE_NAME to a path on the shared app_logs volume, which is what Logstash tails
  # (infra/logstash/pipeline/logstash.conf). Left unset outside Docker on purpose, so local runs
  # and tests keep logging to the console instead of littering the working directory.
  structured:
    format:
      file: ecs
  logback:
    rollingpolicy:
      # app_logs is shared by all 7 services, so cap each one's footprint. Rolled files are named
      # *.log.<date>.<i>.gz and deliberately fall outside Logstash's *.log glob.
      max-file-size: 10MB
      total-size-cap: 200MB
      max-history: 3
