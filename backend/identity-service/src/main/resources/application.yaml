spring:
  application:
    name: identity-service

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/identity_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:30000}

      lettuce:
        pool:
          max-active: ${REDIS_LETTUCE_POOL_MAX_ACTIVE:8}
          max-idle: ${REDIS_LETTUCE_POOL_MAX_IDLE:8}
          min-idle: ${REDIS_LETTUCE_POOL_MIN_IDLE:0}
          max-wait: ${REDIS_LETTUCE_POOL_MAX_WAIT:-1ms}

server:
  port: 8081

jwt:
  secret: ${JWT_SECRET}
  previous-secret: ${JWT_PREVIOUS_SECRET}
  internal-secret: ${JWT_INTERNAL_SECRET}
  expiration-seconds: ${JWT_EXPIRATION_SECONDS:900}
  issuer: ${JWT_ISSUER}
  audience: ${JWT_AUDIENCE}
  excluded-paths:
    - /api/v1/auth/register
    - /api/v1/auth/login
    - /api/v1/auth/refresh
    - /api/v1/auth/logout
    - /api/v1/auth/verify-email
    - /actuator/health
    - /actuator/info
    - /actuator/prometheus

refresh-token:
  absolute-ttl-seconds: ${REFRESH_TOKEN_ABSOLUTE_TTL_SECONDS:2592000}

email-verification:
  # How long the link in the welcome email stays valid; the token is one-time-use regardless.
  ttl-seconds: ${EMAIL_VERIFICATION_TTL_SECONDS:86400}

admin-bootstrap:
  email: ${ADMIN_BOOTSTRAP_EMAIL:}
  password: ${ADMIN_BOOTSTRAP_PASSWORD:}

auth-cookie:
  name: ${AUTH_COOKIE_NAME:refresh_token}
  path: ${AUTH_COOKIE_PATH:/api/v1/auth}
  domain: ${AUTH_COOKIE_DOMAIN:}
  secure: ${AUTH_COOKIE_SECURE:true}
  same-site: ${AUTH_COOKIE_SAME_SITE:Strict}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

outbox:
  cleanup:
    retention-days: ${OUTBOX_CLEANUP_RETENTION_DAYS:14}
    fixed-delay-ms: ${OUTBOX_CLEANUP_FIXED_DELAY_MS:86400000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{correlationId}] %-5level %logger{36} - %msg%n"
