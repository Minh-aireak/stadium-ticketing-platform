spring:
  application:
    name: match-catalog-service

  threads:
    virtual:
      enabled: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/catalog_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    # Spelled out rather than left on Hikari's default of 10, because this service now runs as two
    # instances and the pool is per instance: the number that matters is 2 x this against
    # postgres-catalog's max_connections (Postgres default 100, shared with Debezium's replication
    # slot and postgres-exporter). Smaller than the other services' 20 on purpose -- browse reads
    # are served from the Guava and Redis tiers, and search goes to Elasticsearch, so Postgres only
    # sees cache misses and the rare admin write.
    hikari:
      pool-name: CatalogHikariPool
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:30000}

      lettuce:
        pool:
          max-active: ${REDIS_LETTUCE_POOL_MAX_ACTIVE:8}
          max-idle: ${REDIS_LETTUCE_POOL_MAX_IDLE:8}
          min-idle: ${REDIS_LETTUCE_POOL_MIN_IDLE:0}
          max-wait: ${REDIS_LETTUCE_POOL_MAX_WAIT:-1ms}

server:
  port: 8082

jwt:
  secret: ${JWT_SECRET}
  previous-secret: ${JWT_PREVIOUS_SECRET}
  internal-secret: ${JWT_INTERNAL_SECRET}
  issuer: ${JWT_ISSUER}
  audience: ${JWT_AUDIENCE}
  excluded-paths:
    - /actuator/health
    - /actuator/info
    - /actuator/prometheus
    - /v3/api-docs/**
    - /swagger-ui/**
    - /swagger-ui.html
    # Public catalog browse/search — same paths as the admin-only POST/PUT above, so these
    # must be method-scoped (see JwtAuthenticationFilter) rather than excluding the whole path.
    - "GET:/api/v1/matches"
    - "GET:/api/v1/matches/*"
    - "GET:/api/v1/showtimes/*"

elasticsearch:
  host: ${ELASTICSEARCH_HOST}
  port: ${ELASTICSEARCH_PORT}
  scheme: ${ELASTICSEARCH_SCHEME}
  # catalog_service, scoped to the "matches" index alone — provisioned by
  # infra/elasticsearch/init-security.sh, never the elastic superuser.
  username: ${ELASTICSEARCH_USERNAME}
  password: ${ELASTICSEARCH_PASSWORD}

outbox:
  cleanup:
    retention-days: ${OUTBOX_CLEANUP_RETENTION_DAYS:14}
    fixed-delay-ms: ${OUTBOX_CLEANUP_FIXED_DELAY_MS:86400000}

catalog:
  # AdaptiveTtlLiveSeatStore -- a per-pod cache in front of the Redis seat counts, whose TTL is a
  # deliberate second of staleness traded for collapsing a hot page's thousands of reads per second
  # into one MGET per second per pod. scarcity-threshold is where that trade stops being worth it:
  # below this many seats left, the count is never cached and every read goes to Redis. Roughly 5%
  # of the stadiums in StadiumCatalog (320-540 seats) -- raise it alongside any larger venue.
  live-seats:
    local-ttl-millis: ${CATALOG_LIVE_SEATS_LOCAL_TTL_MILLIS:1000}
    scarcity-threshold: ${CATALOG_LIVE_SEATS_SCARCITY_THRESHOLD:25}
    max-cached-showtimes: ${CATALOG_LIVE_SEATS_MAX_CACHED_SHOWTIMES:10000}

# Resilience4j: Bulkhead/RateLimiter on the public browse/search use cases in
# MatchCatalogService. Both are sized well above inventory's reserve path (100 concurrent, 200/s)
# because a catalog read is a different animal: no distributed lock, no write, and normally served
# from the Guava tier plus a single Redis MGET, so a call occupies its permit for a millisecond or
# two rather than up to the 5s a contended reserve can take.
#
# maxConcurrentCalls 200: the backstop for the SLOW reads, not the fast ones -- a cache miss falls
# through to CatalogHikariPool (10 connections) or Elasticsearch, and 200 in flight against that
# pool drains in ~100ms instead of parking an unbounded number of Tomcat threads on it.
# limitForPeriod 600/s per instance (x2 instances = 1200/s of browse) is the arrival shaper: high
# enough that real browse traffic never sees it, low enough that a flood is cut off here rather
# than in the JVM's heap. Both wait durations are 0 for the same reason as inventory's -- shed the
# excess as a 503 immediately instead of turning the limiter into a second queue.
resilience4j:
  bulkhead:
    instances:
      catalog-read:
        maxConcurrentCalls: 200
        maxWaitDuration: 0
  ratelimiter:
    instances:
      catalog-read:
        limitForPeriod: 600
        limitRefreshPeriod: 1s
        timeoutDuration: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,bulkheads,ratelimiters,prometheus
  endpoint:
    health:
      show-details: when-authorized

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{correlationId}] %-5level %logger{36} - %msg%n"
  # Console stays human-readable for `docker compose logs`. ECS is Spring Boot's own built-in
  # structured format (logging.structured.*), so shipping logs to Elasticsearch needs no logging
  # appender library here — service.name defaults to spring.application.name and the correlationId
  # MDC entry rides along as a top-level field.
  #
  # It applies to the log FILE only, and the file itself is opt-in: docker-compose.yaml sets
  # LOGGING_FILE_NAME to a path on the shared app_logs volume, which is what Logstash tails
  # (infra/logstash/pipeline/logstash.conf). Left unset outside Docker on purpose, so local runs
  # and tests keep logging to the console instead of littering the working directory.
  structured:
    format:
      file: ecs
  logback:
    rollingpolicy:
      # app_logs is shared by all 7 services, so cap each one's footprint. Rolled files are named
      # *.log.<date>.<i>.gz and deliberately fall outside Logstash's *.log glob.
      max-file-size: 10MB
      total-size-cap: 200MB
      max-history: 3
