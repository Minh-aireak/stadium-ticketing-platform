spring:
  application:
    name: ticket-inventory-service

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/inventory_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    # Explicit pool size: the reserve/release hot path no longer touches Postgres at all (Redis
    # hold only — see SeatInventoryService), so this pool only serves the rarer confirm-sale write
    # and read queries. Sized well below the Bulkhead limit below so the DB is never the bottleneck.
    hikari:
      pool-name: InventoryHikariPool
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:30000}
      # Redisson (RedissonSeatHoldAdapter / RedissonDistributedLockAdapter), not Spring Data's
      # Lettuce client, is what actually talks to Redis here — it manages its own connection
      # pool and does not read these lettuce.pool.* properties. Kept for consistency with the
      # other services.
      lettuce:
        pool:
          max-active: ${REDIS_LETTUCE_POOL_MAX_ACTIVE:8}
          max-idle: ${REDIS_LETTUCE_POOL_MAX_IDLE:8}
          min-idle: ${REDIS_LETTUCE_POOL_MIN_IDLE:0}
          max-wait: ${REDIS_LETTUCE_POOL_MAX_WAIT:-1ms}

  # Only bootstrap-servers is read (via @Value in KafkaConfig) — consumer
  # factory, deserializer, group-id, and error handling are all defined
  # programmatically in KafkaConfig.java, which fully overrides Boot's
  # consumer autoconfiguration.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

server:
  port: ${SERVER_PORT:8083}
  tomcat:
    threads:
      # Kept above the Bulkhead's maxConcurrentCalls (100) so requests rejected by the Bulkhead
      # fail fast instead of ever forming a Tomcat-level queue.
      max: 200
      min-spare: 20
    accept-count: 100

# Must match identity-service's jwt.secret/issuer/audience exactly — validated independently
# here so this service is never unauthenticated just because a caller bypassed api-gateway.
jwt:
  secret: ${JWT_SECRET}
  # Set only during a secret rotation window — see docs/secrets_management_strategy.md. No YAML
  # default: must be explicitly set (blank is fine outside a rotation window) — see .env.example.
  previous-secret: ${JWT_PREVIOUS_SECRET}
  # Distinct secret for service-to-service tokens (see InternalServiceTokenProvider) — never
  # accepted for user-issued tokens or vice versa. No YAML default: must be explicitly set (blank
  # falls back to jwt.secret, see InternalServiceTokenProvider) — see .env.example.
  internal-secret: ${JWT_INTERNAL_SECRET}
  issuer: ${JWT_ISSUER}
  audience: ${JWT_AUDIENCE}
  excluded-paths:
    - /actuator/health
    - /actuator/info
    # Prometheus has no user JWT to present — public here for the same reason health/info are.
    - /actuator/prometheus
    - /v3/api-docs/**
    - /swagger-ui/**
    - /swagger-ui.html

inventory:
  hold:
    # Seat hold TTL — Redis auto-expires an abandoned reservation this long
    # after reserveSeats(), no explicit release or cleanup job needed.
    ttl-minutes: ${INVENTORY_HOLD_TTL_MINUTES:10}

services:
  catalog:
    base-url: ${MATCH_CATALOG_SERVICE_URL}

outbox:
  cleanup:
    # Debezium reads outbox_events via WAL, not the table itself — rows older than this are
    # safe to purge regardless of whether CDC has "processed" them.
    retention-days: ${OUTBOX_CLEANUP_RETENTION_DAYS:14}
    fixed-delay-ms: ${OUTBOX_CLEANUP_FIXED_DELAY_MS:86400000}

# Resilience4j: Bulkhead/RateLimiter on SeatInventoryService's reserve/release use cases (the
# flash-sale hot path). maxWaitDuration/timeoutDuration are 0 on purpose — fail fast with a 503
# instead of queueing caller threads on top of the 5s Redisson lock wait.
resilience4j:
  bulkhead:
    instances:
      seat-inventory:
        maxConcurrentCalls: 100
        maxWaitDuration: 0
  ratelimiter:
    instances:
      seat-inventory:
        limitForPeriod: 200
        limitRefreshPeriod: 1s
        timeoutDuration: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,bulkheads,ratelimiters,prometheus
  endpoint:
    health:
      show-details: when-authorized

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{correlationId}] %-5level %logger{36} - %msg%n"
