spring:
  application:
    name: ticket-inventory-service

  threads:
    virtual:
      enabled: true

  lifecycle:
    # Bounds the graceful shutdown configured under server: below. Spring waits this long for
    # in-flight work -- HTTP requests and the Kafka listener containers alike -- before forcing the
    # rest down. Comfortably clear of anything holding the 10s seat lock, and deliberately below
    # docker-compose's stop_grace_period, which has to outlast it or SIGKILL lands mid-drain.
    timeout-per-shutdown-phase: 30s

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/inventory_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    # Explicit pool size: the reserve/release hot path no longer touches Postgres at all (Redis
    # hold only — see SeatInventoryService), so this pool only serves the rarer confirm-sale write
    # and read queries. Sized well below the Bulkhead limit below so the DB is never the bottleneck.
    #
    # No minimum-idle: Hikari then defaults it to maximum-pool-size and keeps every connection
    # open, the fixed-size pool HikariCP itself recommends. Two instances hold 2 x 20 = 40 of
    # postgres-inventory's 100 max_connections permanently, which still leaves room for Debezium
    # and postgres-exporter.
    hikari:
      pool-name: InventoryHikariPool
      maximum-pool-size: 20
      connection-timeout: 3000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:30000}
      # No lettuce.pool.* here: redisson-spring-boot-starter excludes lettuce-core and nothing
      # else brings commons-pool2, so Redisson is the only Redis client in this platform and
      # manages its own connection pool. The four properties that used to sit here were read by
      # nothing. What does reach Redisson is the per-command budget in RedissonCommandBudgetConfig
      # (redis.command.timeout-ms / redis.command.retry-attempts), overridable here per service.

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

server:
  port: 8083
  # Finish in-flight requests instead of dropping them when the container stops. This matters more
  # on a replicated service than a single one: behind nginx a severed request surfaces as a bare
  # 502 that says nothing about which side cut it, and restarting one instance at a time is most of
  # the reason for running two.
  shutdown: graceful

jwt:
  secret: ${JWT_SECRET}
  previous-secret: ${JWT_PREVIOUS_SECRET}
  internal-secret: ${JWT_INTERNAL_SECRET}
  issuer: ${JWT_ISSUER}
  audience: ${JWT_AUDIENCE}
  excluded-paths:
    - /actuator/health
    - /actuator/info
    - /actuator/prometheus

inventory:
  hold:
    ttl-minutes: ${INVENTORY_HOLD_TTL_MINUTES:10}
  pricing:
    # The currency every seat price in this deployment is denominated in. Seat rows store a bare
    # NUMERIC, so this is the only place that says what those numbers mean — and it is returned
    # with every quoted price so no downstream service has to take a client's word for it.
    currency: ${INVENTORY_PRICING_CURRENCY:VND}

services:
  catalog:
    base-url: ${MATCH_CATALOG_SERVICE_URL}

outbox:
  cleanup:
    retention-days: ${OUTBOX_CLEANUP_RETENTION_DAYS:14}
    fixed-delay-ms: ${OUTBOX_CLEANUP_FIXED_DELAY_MS:86400000}

# Resilience4j: Bulkhead/RateLimiter on SeatInventoryService's reserve/release use cases (the
# flash-sale hot path). maxWaitDuration/timeoutDuration are 0 on purpose — fail fast with a 503
# instead of queueing caller threads on top of the 5s Redisson lock wait.
resilience4j:
  bulkhead:
    instances:
      seat-inventory:
        maxConcurrentCalls: 100
        maxWaitDuration: 0
  ratelimiter:
    instances:
      seat-inventory:
        limitForPeriod: 200
        limitRefreshPeriod: 1s
        timeoutDuration: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,bulkheads,ratelimiters,prometheus
  endpoint:
    health:
      show-details: when-authorized

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{correlationId}] %-5level %logger{36} - %msg%n"
  # Console stays human-readable for `docker compose logs`. ECS is Spring Boot's own built-in
  # structured format (logging.structured.*), so shipping logs to Elasticsearch needs no logging
  # appender library here — service.name defaults to spring.application.name and the correlationId
  # MDC entry rides along as a top-level field.
  #
  # It applies to the log FILE only, and the file itself is opt-in: docker-compose.yaml sets
  # LOGGING_FILE_NAME to a path on the shared app_logs volume, which is what Logstash tails
  # (infra/logstash/pipeline/logstash.conf). Left unset outside Docker on purpose, so local runs
  # and tests keep logging to the console instead of littering the working directory.
  structured:
    format:
      file: ecs
  logback:
    rollingpolicy:
      # app_logs is shared by all 7 services, so cap each one's footprint. Rolled files are named
      # *.log.<date>.<i>.gz and deliberately fall outside Logstash's *.log glob.
      max-file-size: 10MB
      total-size-cap: 200MB
      max-history: 3
