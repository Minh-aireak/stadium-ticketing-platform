groups:
  # ── Availability ────────────────────────────────────────────────────
  - name: availability
    rules:
      - alert: ServiceDown
        expr: up{job!="prometheus"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} is not being scraped"
          description: >-
            Prometheus has failed to scrape {{ $labels.job }} ({{ $labels.instance }}) for 2
            minutes. Either the process is down or its /actuator/prometheus endpoint stopped
            answering. Check `docker compose ps` and the container logs.

      - alert: PostgresDown
        expr: pg_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Postgres {{ $labels.database }} unreachable"
          description: >-
            postgres-exporter cannot connect to {{ $labels.instance }} ({{ $labels.database }}).
            The owning service will be failing every request that touches the database.

      - alert: RedisDown
        expr: redis_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Redis unreachable"
          description: >-
            Redis is down. Seat holds, refresh sessions, password-reset tokens and the gateway's
            rate limiter all live here; note the gateway fails OPEN on Redis errors, so rate
            limiting is silently not being enforced while this fires.

  # ── Event pipeline ──────────────────────────────────────────────────
  # The outbox pattern means a stalled consumer is invisible from the HTTP side: writes keep
  # succeeding while nothing downstream reacts. These are the alerts that surface that.
  - name: messaging
    rules:
      # kafka_consumergroup_lag comes from kafka-exporter (see prometheus.yml's kafka-exporter
      # job), which is the only thing in this stack that publishes consumer lag at all. This
      # used to read kafka_consumer_fetch_manager_records_lag — the client-side Micrometer
      # metric — which nothing exports: binding it needs a MicrometerConsumerListener on the
      # ConsumerFactory, and AbstractKafkaConsumerConfig builds its own DefaultKafkaConsumerFactory
      # with no listeners (Spring Boot's own auto-configured factory, which would have carried
      # one, backs off as soon as a ConsumerFactory bean is declared). The alert therefore
      # evaluated an empty vector and could never fire, which is the worst way for an alert about
      # silent failure to fail. The Kafka dashboard was already reading the exporter's metric.
      #
      # max by (consumergroup, topic), not sum: group+topic is the actionable unit, every topic
      # here has exactly one partition by design, and the exporter reports -1 for a partition the
      # group has never committed an offset for — max keeps that reading quiet instead of letting
      # it drag a sum around.
      - alert: KafkaConsumerLagGrowing
        expr: max by (consumergroup, topic) (kafka_consumergroup_lag) > 1000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.consumergroup }} is falling behind on {{ $labels.topic }}"
          description: >-
            Consumer group {{ $labels.consumergroup }} has held a backlog above 1000 records on
            {{ $labels.topic }} for 10 minutes. Bookings may be confirming without their side
            effects (emails, inventory release) landing.

      # This read spring_kafka_listener_seconds_count{result="failure"} until the metric was
      # measured rather than assumed. That timer is recorded once per listener INVOCATION, and
      # DefaultErrorHandler retries by seeking the record back for redelivery -- so every attempt
      # in a retry sequence lands another failure sample. With `for: 0m` the alert therefore fired
      # on the first transient throw, the Postgres blip or Redis reconnect the next retry cleared,
      # and sent the operator looking for a record on a -dlt that nothing had written. It was not
      # measuring dead letters at all; it was measuring that a listener had a bad second.
      #
      # The broker's own end offset for the -dlt topic is the thing the alert name claims, and
      # kafka-exporter already publishes it -- the Kafka dashboard reads the same series. A record
      # is on the topic or it is not, and retries that eventually succeed leave it untouched.
      #
      # sum by (topic), not by partition: every topic has one partition today, and a topic that
      # later grows more should still read as one alert rather than one per partition.
      - alert: DeadLetterRecordsAppearing
        expr: sum by (topic) (increase(kafka_topic_partition_current_offset{topic=~".+-dlt"}[15m])) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "a record was dead-lettered onto {{ $labels.topic }}"
          description: >-
            A listener exhausted its retries and the record was republished to
            {{ $labels.topic }}. Nothing replays a dead-lettered record automatically — grep the
            logs for {{ $labels.topic }}, which every dead-letter consumer prints alongside the
            offset and the exception that caused it. Most log that at ERROR behind an "ALERT:"
            prefix; ticket-inventory-service's bookability-cache consumer logs at WARN without
            one, because a stale cache costs a round trip rather than a booking. Where two
            services consume the same topic each reports only its own consumer group's failures,
            so exactly one line describes this record. This reads the broker's own end offset
            via kafka-exporter rather than the services' spring_kafka_listener timer, which
            counts every failed ATTEMPT and so fires on a blip the next retry clears, well
            before anything is actually dead-lettered.

  # ── Application health ──────────────────────────────────────────────
  - name: application
    rules:
      - alert: HighServerErrorRate
        expr: >-
          sum by (job) (rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
          /
          sum by (job) (rate(http_server_requests_seconds_count[5m]))
          > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} is serving over 5% 5xx"
          description: >-
            More than 5% of requests to {{ $labels.job }} have failed with a server error for 5
            minutes.

      - alert: RateLimiterFailingOpen
        expr: increase(gateway_ratelimit_redis_unavailable_total[5m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Gateway rate limiting is failing open"
          description: >-
            RedisRateLimiter swallowed a Redis error and allowed the request through. While this
            fires, login/register/forgot-password are effectively unlimited — see
            RateLimitingWebFilter's fail-open note.

      - alert: DatabaseConnectionPoolSaturated
        expr: hikaricp_connections_active / hikaricp_connections_max > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} HikariCP pool over 90% in use"
          description: >-
            {{ $labels.job }} has held more than 90% of its connections active for 5 minutes.
            Requests will start blocking on connection acquisition.

      - alert: BulkheadNearExhaustion
        expr: >-
          resilience4j_bulkhead_available_concurrent_calls
          /
          resilience4j_bulkhead_max_allowed_concurrent_calls
          < 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} bulkhead {{ $labels.name }} is nearly out of permits"
          description: >-
            Fewer than 10% of the permits on {{ $labels.name }} have been free for 5 minutes, so
            {{ $labels.job }} is shedding requests with 503 (BulkheadFullException). A bulkhead
            guards more than the call that filled it: catalog-read is held by the Elasticsearch
            search but also gates getMatch and the no-query browse, and seat-inventory is held by
            the catalog lookup but also gates every hold and reserve. So the endpoint users
            complain about is usually not the one that is actually stuck -- look for a slow
            dependency behind it first. catalog-showtime is the exception and reads literally:
            it wraps one call, the showtime lookup ticket-inventory-service makes before every
            hold and reserve, so this firing on it means the buy path itself is being shed.

      - alert: JvmHeapPressure
        expr: >-
          sum by (job) (jvm_memory_used_bytes{area="heap"})
          /
          sum by (job) (jvm_memory_max_bytes{area="heap"})
          > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} heap above 90%"
          description: >-
            {{ $labels.job }} has used more than 90% of max heap for 10 minutes and is probably
            in a GC death spiral.

  # ── Business-level ──────────────────────────────────────────────────
  - name: business
    rules:
      - alert: UnreconciledPaymentsAccumulating
        expr: payment_unreconciled_count > 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Payments taken but not reconciled"
          description: >-
            UnreconciledPaymentAlertJob has been reporting unreconciled payments for 15 minutes.
            A customer has been charged without their booking being confirmed — this needs a
            human, not a retry.

      # The mirror image of the alert above, one step further along the saga: the payment DID
      # land, the booking IS confirmed, and the seats were never marked SOLD. There is no retry
      # left to try — ticket-inventory-service has answered that these seats belong to a different
      # booking (or that the showtime has no inventory at all), and it will keep answering that.
      # InventoryConfirmationReconciler drops these rows from its queue precisely so they stop
      # looking like a backlog that is draining, which is what makes this gauge the only thing
      # that still knows about them.
      - alert: BookingSeatsSoldToSomeoneElse
        expr: booking_inventory_sale_refused_count > 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "a paid, confirmed booking has seats it does not own"
          description: >-
            InventoryConfirmationReconciler has been reporting bookings whose seat sale
            ticket-inventory-service refused for 15 minutes. Each one is CONFIRMED, paid for, and
            has already had its confirmation email sent, for seats that belong to another booking.
            Nothing retries these — grep the logs for "ALERT:" to find which, then refund or
            reseat by hand.

      # The transient half of the same path, and deliberately a warning rather than a page: a
      # ticket-inventory restart puts bookings here for a cycle or two and the next run clears
      # them. Half an hour of it is not a restart, and every minute of it is a window in which a
      # sold seat's Redis hold (TTL 10 minutes) has lapsed and the seat is bookable by somebody
      # else — which is how a booking ends up in BookingSeatsSoldToSomeoneElse above.
      - alert: SeatSalesNotFinalizing
        expr: booking_inventory_unconfirmed_count > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "paid bookings are not getting their seats marked sold"
          description: >-
            InventoryConfirmationReconciler has had CONFIRMED bookings awaiting their seat sale
            for 30 minutes. Their seat holds have long since expired, so those seats are on sale
            again to other customers while the original buyers hold paid, confirmed bookings for
            them.
