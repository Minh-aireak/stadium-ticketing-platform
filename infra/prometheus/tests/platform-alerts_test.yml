# ============================================================================
# promtool unit tests for infra/prometheus/rules/platform-alerts.yml.
#
# Deliberately NOT in rules/ — prometheus.yml globs /etc/prometheus/rules/*.yml
# as rule files, and a test file landing in that glob fails Prometheus startup.
# Nothing in CI runs this yet; run it by hand from the repo root:
#
#   docker run --rm --entrypoint promtool \
#     -v "$PWD/infra/prometheus/rules:/rules:ro" \
#     -v "$PWD/infra/prometheus/tests:/tests:ro" \
#     prom/prometheus:v3.13.2 test rules /tests/platform-alerts_test.yml
#
# Two rules are covered, both for the same reason: each can silently evaluate to
# an empty vector — an alert that can never fire — without anything looking wrong.
#
# BulkheadNearExhaustion divides two separate metrics, and that division yields
# nothing at all if the two ever stop sharing a label set. The healthy bulkhead in
# the fixture is what pins that down.
#
# KafkaConsumerLagGrowing names a metric that has to come from outside the
# application: it read kafka_consumer_fetch_manager_records_lag until it was found
# that nothing in the stack publishes that series (see the rule's own comment), so
# it had been dead since it was written. The fixture uses kafka-exporter's real
# label set — consumergroup/topic/partition — so a future edit back to a
# client-side metric name fails here instead of in production silence.
#
# The other rules are single-series thresholds with nothing comparable to get wrong.
# ============================================================================

rule_files:
  - /rules/platform-alerts.yml

evaluation_interval: 1m

tests:
  # catalog-read wedged behind a stalled Elasticsearch: 198 of its 200 permits
  # taken and not coming back (see ElasticsearchClientConfig for how that used to
  # last ten minutes). seat-inventory is healthy at 90/100 in the same scrape,
  # and must stay quiet — if the division cross-joined the two bulkheads instead
  # of matching them on `name`, it would not.
  - interval: 1m
    input_series:
      - series: 'resilience4j_bulkhead_available_concurrent_calls{job="match-catalog-service",name="catalog-read"}'
        values: "2x10"
      - series: 'resilience4j_bulkhead_max_allowed_concurrent_calls{job="match-catalog-service",name="catalog-read"}'
        values: "200x10"
      - series: 'resilience4j_bulkhead_available_concurrent_calls{job="ticket-inventory-service",name="seat-inventory"}'
        values: "90x10"
      - series: 'resilience4j_bulkhead_max_allowed_concurrent_calls{job="ticket-inventory-service",name="seat-inventory"}'
        values: "100x10"
    alert_rule_test:
      # Below the rule's `for: 5m`, so a brief flash-sale saturation stays silent.
      - eval_time: 4m
        alertname: BulkheadNearExhaustion
        exp_alerts: []
      - eval_time: 6m
        alertname: BulkheadNearExhaustion
        exp_alerts:
          - exp_labels:
              severity: warning
              job: match-catalog-service
              name: catalog-read
            exp_annotations:
              summary: "match-catalog-service bulkhead catalog-read is nearly out of permits"
              description: >-
                Fewer than 10% of the permits on catalog-read have been free for 5 minutes, so match-catalog-service is shedding requests with 503 (BulkheadFullException). A bulkhead guards more than the call that filled it: catalog-read is held by the Elasticsearch search but also gates getMatch, getShowtime and the no-query browse, and seat-inventory is held by the catalog lookup but also gates every hold and reserve. So the endpoint users complain about is usually not the one that is actually stuck -- look for a slow dependency behind it first.

  # A consumer group genuinely stuck behind a topic, next to a healthy group in the
  # same scrape. The healthy one must stay quiet, and so must the partition the
  # group has never committed an offset for — kafka-exporter reports that as -1,
  # and a -1 must never read as "caught up" nor drag the comparison around.
  - interval: 1m
    input_series:
      - series: 'kafka_consumergroup_lag{consumergroup="notification-service",topic="booking.booking.confirmed",partition="0"}'
        values: "5000x15"
      - series: 'kafka_consumergroup_lag{consumergroup="booking-service",topic="payment.payment.succeeded",partition="0"}'
        values: "12x15"
      - series: 'kafka_consumergroup_lag{consumergroup="catalog-service",topic="inventory.seats.sold",partition="0"}'
        values: "-1x15"
    alert_rule_test:
      # Below the rule's `for: 10m`, so a short burst of backlog stays silent.
      - eval_time: 9m
        alertname: KafkaConsumerLagGrowing
        exp_alerts: []
      - eval_time: 11m
        alertname: KafkaConsumerLagGrowing
        exp_alerts:
          - exp_labels:
              severity: warning
              consumergroup: notification-service
              topic: booking.booking.confirmed
            exp_annotations:
              summary: "notification-service is falling behind on booking.booking.confirmed"
              description: >-
                Consumer group notification-service has held a backlog above 1000 records on booking.booking.confirmed for 10 minutes. Bookings may be confirming without their side effects (emails, inventory release) landing.
