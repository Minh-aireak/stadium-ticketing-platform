global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alerting rules only — there is no Alertmanager in this compose stack yet, so a firing alert is
# visible on Prometheus' own /alerts page and in Grafana, and goes nowhere else. Add an
# `alerting.alertmanagers` block here when one is deployed.
rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: node-exporter

  - job_name: redis-exporter
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          service: redis-exporter

  - job_name: kafka-exporter
    static_configs:
      - targets: ["kafka-exporter:9308"]
        labels:
          service: kafka-exporter

  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api-gateway:8080"]
        labels:
          service: api-gateway
          application: api-gateway

  - job_name: identity-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["identity-service:8081"]
        labels:
          service: identity-service
          application: identity-service

  - job_name: match-catalog-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - "match-catalog-service-1:8082"
          - "match-catalog-service-2:8082"
        labels:
          service: match-catalog-service
          application: match-catalog-service

  - job_name: ticket-inventory-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - "ticket-inventory-service-1:8083"
          - "ticket-inventory-service-2:8083"
        labels:
          service: ticket-inventory-service
          application: ticket-inventory-service

  - job_name: payment-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["payment-service:8084"]
        labels:
          service: payment-service
          application: payment-service

  - job_name: notification-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["notification-service:8085"]
        labels:
          service: notification-service
          application: notification-service

  - job_name: booking-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["booking-service:8086"]
        labels:
          service: booking-service
          application: booking-service

  # Multi-target probe: one postgres-exporter container serves metrics for all 6
  # Postgres instances via /probe?target=<host:port>/<dbname>&auth_module=aireak (see
  # infra/postgres-exporter/config.yaml). __address__ is rewritten to the exporter
  # itself; the real DB host:port travels in the "instance" label.
  - job_name: postgres
    metrics_path: /probe
    params:
      auth_module: [aireak]
    static_configs:
      - targets: ["postgres-identity:5432"]
        labels:
          database: identity_db
      - targets: ["postgres-inventory:5432"]
        labels:
          database: inventory_db
      - targets: ["postgres-booking:5432"]
        labels:
          database: booking_db
      - targets: ["postgres-payment:5432"]
        labels:
          database: payment_db
      - targets: ["postgres-catalog:5432"]
        labels:
          database: catalog_db
      - targets: ["postgres-notification:5432"]
        labels:
          database: notification_db
    relabel_configs:
      # The probe target has to carry the database name. postgres_exporter builds its whole
      # DSN out of this one parameter, and lib/pq resolves a missing dbname to the USERNAME --
      # which here is a role that owns six databases and is the name of none of them, so every
      # probe answered `pg_up 0` and four metrics instead of 311. Joined on from the `database`
      # label rather than written into `targets` so the name the alert prints and the name the
      # probe connects to cannot drift apart.
      - source_labels: [__address__, database]
        separator: /
        target_label: __param_target
      # Set before __address__ is overwritten below, and read from __address__ rather than
      # __param_target so instance stays host:port -- the database is already its own label.
      # Without an explicit instance here all six targets collapse onto the exporter's address.
      - source_labels: [__address__]
        target_label: instance
      - target_label: __address__
        replacement: postgres-exporter:9187
