global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: node-exporter

  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api-gateway:8080"]
        labels:
          service: api-gateway

  - job_name: identity-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["identity-service:8081"]
        labels:
          service: identity-service

  - job_name: match-catalog-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["match-catalog-service:8082"]
        labels:
          service: match-catalog-service

  - job_name: ticket-inventory-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["ticket-inventory-service:8083"]
        labels:
          service: ticket-inventory-service

  - job_name: payment-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["payment-service:8084"]
        labels:
          service: payment-service

  - job_name: notification-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["notification-service:8085"]
        labels:
          service: notification-service

  - job_name: booking-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["booking-service:8086"]
        labels:
          service: booking-service
