# =============================================================================
# Load balancer in front of the ticket-inventory-service replicas.
# =============================================================================
# Every caller of seat inventory (api-gateway for /api/v1/inventory/**, and
# booking-service for the saga's hold/confirm/release steps) points at this
# container rather than at one instance, so both replicas actually share the
# flash-sale hot path. Adding a third replica is one `server` line here plus one
# compose stanza -- there is no service registry, so nginx only knows the
# instances that are written down.
# =============================================================================

upstream ticket_inventory {
    # least_conn, not the default round-robin: a reserve call can block for up to 5s waiting on the
    # Redisson seat lock (see RedissonSeatHoldAdapter) while a plain availability read returns in
    # milliseconds, so an instance's in-flight count is a much better load signal than its share of
    # the request count.
    least_conn;

    # max_fails/fail_timeout is the only health checking nginx OSS has, and it is passive: an
    # instance leaves the rotation after it has already failed 3 requests, and is retried blind
    # 10s later. This is precisely the gap Eureka/Consul close with active heartbeats.
    server ticket-inventory-service-1:8083 max_fails=3 fail_timeout=10s;
    server ticket-inventory-service-2:8083 max_fails=3 fail_timeout=10s;

    # Reuse upstream connections instead of a fresh TCP handshake per request. Requires the
    # proxy_http_version/Connection pair set below to have any effect.
    #
    # 128, not 32, for the reason catalog-lb.conf gives: the figure is IDLE connections per
    # worker, and with worker_processes auto and hundreds of client connections in flight, 32
    # meant most requests opened and closed a fresh connection to Tomcat. On catalog-lb that was
    # measured at 540-560% CPU for nginx with the JVMs behind it starved; 128 brought nginx to
    # 130-170%. Not measured separately on this LB -- same image, same construction, same host.
    keepalive 128;
}

server {
    listen 8083;
    server_name _;

    # api-gateway gives up on a downstream after 10s (httpclient.response-timeout). These are set
    # a little wider so the gateway's own timeout is the one that fires and reports the error,
    # rather than nginx cutting the request short first and turning it into a 504.
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    # Used by the container's healthcheck. Answered by nginx itself, so it stays 200 even when
    # both replicas are down -- it reports "the load balancer is up", not "inventory is up".
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://ticket_inventory;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Names the instance that actually served the request. The seat-lock contention test leans
        # on it: if two competing requests happen to land on the SAME instance the test proves
        # nothing about the distributed lock, and without this header nobody would notice. `always`
        # so it is emitted on error responses too -- which is precisely when it is wanted.
        add_header X-Upstream $upstream_addr always;

        # Deliberately WITHOUT the `non_idempotent` flag. This is nginx's default and it means a
        # POST that has already been handed to an instance is never replayed against the other
        # one: silently retrying a seat reservation that may well have succeeded is exactly how a
        # seat gets sold twice. Only connection-level failures before the request was sent fail
        # over, and only once.
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 2;
    }
}
