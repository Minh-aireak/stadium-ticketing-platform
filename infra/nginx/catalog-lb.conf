# =============================================================================
# Load balancer in front of the match-catalog-service replicas.
# =============================================================================
# Every caller of the catalog points here rather than at an instance: api-gateway
# for /api/v1/matches/** and /api/v1/showtimes/**, and ticket-inventory-service
# for the requireBookable check on the reserve path. Adding a third replica is
# one `server` line here plus one compose stanza -- there is no service
# registry, so nginx only knows the instances that are written down.
# =============================================================================

upstream match_catalog {
    # Plain round-robin, unlike ticket-inventory-lb's least_conn. Nothing here blocks on a lock,
    # so in-flight count carries no signal the request count does not already carry -- and an even
    # split is what makes the local-cache divergence window measurable: an admin write served by
    # one instance should be observable as stale on the other, which is hard to catch if traffic
    # keeps landing on the pod that already knows about the write.
    server match-catalog-service-1:8082 max_fails=3 fail_timeout=10s;
    server match-catalog-service-2:8082 max_fails=3 fail_timeout=10s;

    # Reuse upstream connections instead of a fresh TCP handshake per request. Requires the
    # proxy_http_version/Connection pair set below to have any effect.
    #
    # 128, not 32: this is the number of IDLE upstream connections each worker keeps, and with
    # worker_processes auto (8 on the dev box) and hundreds of client connections in flight, 32
    # meant most requests past the first few dozen per worker opened a new connection to Tomcat
    # and closed it again. Measured 2026-09-12 with the catalog-read limiter lifted (wrk, 30s
    # steps): at 800 connections this container burned 540-560% CPU and the two JVMs behind it
    # were starved to 50-100% each, 4 163 req/s; at 128 nginx sat at 130-170%, the JVMs got
    # 200-250% each, 6 104 req/s. Same host, same JVMs, same 8 cores at 99-100% either way -- the
    # difference is where they were spent.
    keepalive 128;
}

server {
    listen 8082;
    server_name _;

    # api-gateway gives up on a downstream after 10s (httpclient.response-timeout). These are set
    # a little wider so the gateway's own timeout is the one that fires and reports the error,
    # rather than nginx cutting the request short first and turning it into a 504.
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    # Used by the container's healthcheck. Answered by nginx itself, so it stays 200 even when
    # both replicas are down -- it reports "the load balancer is up", not "the catalog is up".
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://match_catalog;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Names the instance that actually served the request. Browse reads are where the two
        # instances can legitimately disagree for up to the 5s local cache TTL, so "which pod
        # answered this" is the first question to ask of any surprising response here.
        add_header X-Upstream $upstream_addr always;

        # Deliberately WITHOUT the `non_idempotent` flag, matching ticket-inventory-lb. Reads are
        # safe to replay, but the admin writes on this same prefix (publish, cancel, addShowtime)
        # are not, and nginx cannot tell them apart here. Only connection-level failures before
        # the request was sent fail over, and only once.
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 2;
    }
}
