input {
  file {
    path => "/var/log/app/*.log"
    codec => json
    mode => "tail"
    start_position => "beginning"
  }
}

filter {
  mutate {
    # [log][file] is deliberately NOT dropped: the file input sets it to the path being tailed
    # (/var/log/app/ticket-inventory-service-1.log), and that is the only field telling the two
    # instances of ticket-inventory-service apart -- ECS service.name is identical for both.
    # Without it a Kibana query for that service returns one indistinguishable stream, and the seat
    # contention test cannot be traced back to the instance that handled each request.
    remove_field => ["[host]", "[event]", "[@version]"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    data_stream => "true"
    data_stream_type => "logs"
    data_stream_dataset => "stadium"
    data_stream_namespace => "dev"
    user => "${LOGSTASH_USERNAME}"
    password => "${LOGSTASH_PASSWORD}"
  }
}
