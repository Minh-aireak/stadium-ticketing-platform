server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # nginx compresses nothing by default. vendor-react alone went out at 277 kB where 87 kB would
    # do, and the whole landing path at 559 kB against 175 kB. vite's build output quotes the
    # gzipped column, so every figure read while tuning chunks described a transfer that was not
    # happening.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    # Everything vite emits under /assets/ carries a content hash in its name, so its bytes can
    # never change meaning — a year of immutable caching costs nothing and saves the revalidation
    # round trip these files were getting on every single load.
    location /assets/ {
        # And a hashed file that is not on disk is a stale reference from a client still holding
        # an older index.html. The SPA fallback below would answer it with HTML, which the browser
        # then hands to import() as JavaScript; the route-level lazy() imports in routes/router.tsx
        # make that the normal outcome for any tab left open across a deploy. A 404 is a failure
        # the app can actually see.
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The one file whose URL is stable, and the only thing that knows the current hashes. It must
    # be revalidated every load, or a deploy reaches nobody who already has the old one.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: react-router-dom handles routing client-side, so any
    # unknown path must still serve index.html instead of a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
