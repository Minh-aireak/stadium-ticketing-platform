name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ── Stage 1: Build + Test (full reactor) ──────────────────────────
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Build & test (full reactor, fail-at-end)
        run: ./mvnw verify -fae -B

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/**/target/surefire-reports/
          retention-days: 7

  # ── Stage 2: Docker image build (per service) ─────────────────────
  docker-build:
    needs: build-and-test
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - booking-service
          - identity-service
          - match-catalog-service
          - notification-service
          - payment-service
          - ticket-inventory-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image — ${{ matrix.service }}
        run: |
          docker build \
            -t aireak/${{ matrix.service }}:${{ github.sha }} \
            -f backend/${{ matrix.service }}/Dockerfile \
            backend/
