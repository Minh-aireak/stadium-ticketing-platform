name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ── Stage 1: Build + Test (full reactor) ──────────────────────────
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Grant execute permission for mvnw
        run: chmod +x mvnw

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Build & test (full reactor, fail-at-end)
        run: ./mvnw verify -fae -B

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/**/target/surefire-reports/
          retention-days: 7

  # ── Stage 1b: Frontend lint + typecheck + build ───────────────────
  # Runs alongside the backend rather than after it: the two share no build inputs, and a broken
  # tsc should fail the PR without waiting on a nine-minute Maven reactor.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `npm run build` is `tsc -b && vite build`, so this is the typecheck too — the app is
      # never type-checked anywhere else in CI.
      - name: Typecheck & build
        run: npm run build

  # ── Stage 2: Docker image build (per backend service) ─────────────
  docker-build:
    needs: build-and-test
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - booking-service
          - identity-service
          - match-catalog-service
          - notification-service
          - payment-service
          - ticket-inventory-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image — ${{ matrix.service }}
        run: |
          docker build \
            -t aireak/${{ matrix.service }}:${{ github.sha }} \
            -f backend/${{ matrix.service }}/Dockerfile \
            backend/

  # ── Stage 2b: Docker image build (frontend) ───────────────────────
  # The matrix above covers the seven backend services only, so nothing built the
  # storefront image: frontend/Dockerfile and frontend/nginx.conf could break and CI
  # would stay green, because `npm run build` in the `frontend` job exercises neither.
  #
  # Its own job rather than an eighth matrix entry, because that job needs
  # build-and-test and this image shares no input with the Maven reactor — the same
  # reasoning that keeps the `frontend` job off the backend's critical path.
  #
  # VITE_API_BASE_URL is left at the Dockerfile's default. It is baked into the bundle,
  # so the value only matters for an image someone actually deploys; what is being
  # checked here is that the two stages build and that nginx gets its config.
  frontend-docker-build:
    needs: frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image — frontend
        run: |
          docker build \
            -t aireak/frontend:${{ github.sha }} \
            -f frontend/Dockerfile \
            frontend/

      # A built image still says nothing about whether nginx will serve the SPA. This
      # catches a broken nginx.conf, and the try_files fallback specifically: without it
      # every client-side route 404s on reload, which no other check in this pipeline
      # would notice.
      - name: Smoke-test the served SPA
        run: |
          docker run -d --name fe-ci -p 8088:80 aireak/frontend:${{ github.sha }}
          for i in $(seq 1 15); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8088/)" = "200" ] && break
            sleep 1
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8088/)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8088/account)" = "200"
          curl -s http://localhost:8088/ | grep -q 'assets/index-.*\.js'
          docker rm -f fe-ci
